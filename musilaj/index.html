<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Müsilaj Avcısı</title>
<meta name="description" content="Marmara'yı müsilajdan temizle! Tekneni sür, deniz salyasını topla, arıtma tesisleri kur.">
<meta name="theme-color" content="#0b3550">
<style>
  :root {
    --ink: #0b2233;
    --panel: rgba(8, 36, 56, 0.82);
    --accent: #2ec4b6;
    --accent-dark: #1a9e92;
    --gold: #ffd166;
    --slime: #c9b46a;
    --danger: #e76f51;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b3550; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
    padding: calc(6px + env(safe-area-inset-top)) 10px 6px;
    background: var(--panel); backdrop-filter: blur(6px);
    font-size: 13px; font-weight: 600;
  }
  #hud .lvl { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 80px; }
  .meter { display: flex; align-items: center; gap: 6px; }
  .bar { width: 70px; height: 10px; border-radius: 6px; background: rgba(255,255,255,0.18); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; border-radius: 6px; transition: width .15s; }
  #cleanBar { background: linear-gradient(90deg, #e76f51, #ffd166 45%, #2ec4b6); }
  #tankBar { background: #b08d3c; }
  #tankBar.full { background: var(--danger); animation: blink .6s infinite alternate; }
  @keyframes blink { to { opacity: .45; } }
  .money { color: var(--gold); font-size: 15px; }
  #pauseBtn {
    border: 0; border-radius: 8px; width: 32px; height: 28px;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 14px; cursor: pointer;
  }

  #toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 3;
    transform: translate(-50%, 20px); opacity: 0; transition: .25s;
    max-width: min(92vw, 440px); padding: 10px 16px; border-radius: 12px;
    background: rgba(8, 36, 56, 0.92); font-size: 14px; text-align: center; pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #overlay {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(4, 22, 36, 0.55); backdrop-filter: blur(3px);
  }
  #overlay.hidden { display: none; }
  .card {
    width: 100%; max-width: 420px; max-height: 92vh; overflow-y: auto;
    background: linear-gradient(160deg, #124a6b, #0b2f47);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
    padding: 22px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .card h1 { margin: 4px 0 2px; font-size: 30px; letter-spacing: .5px; }
  .card h1 span { color: var(--slime); }
  .card h2 { margin: 4px 0 8px; font-size: 22px; }
  .card p { margin: 8px 0; line-height: 1.45; font-size: 15px; color: #d7e7f0; }
  .card .big { font-size: 46px; line-height: 1.1; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .btn {
    border: 0; border-radius: 14px; padding: 13px 16px; cursor: pointer;
    font-size: 17px; font-weight: 700; color: #04222f; background: var(--accent);
    box-shadow: 0 4px 0 var(--accent-dark);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-dark); }
  .btn.alt { background: rgba(255,255,255,0.14); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .btn.gold { background: var(--gold); box-shadow: 0 4px 0 #c9a13f; }
  .btn:disabled { opacity: .45; cursor: default; }
  .fact {
    text-align: left; margin: 14px 0 4px; padding: 12px 14px; border-radius: 12px;
    background: rgba(46, 196, 182, 0.13); border-left: 4px solid var(--accent); font-size: 14px; line-height: 1.45;
  }
  .fact b { display: block; margin-bottom: 4px; color: var(--accent); }
  .how { text-align: left; font-size: 14px; color: #d7e7f0; margin: 12px 0 0; padding-left: 20px; line-height: 1.55; }
  .levels { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .levels button {
    width: 46px; height: 46px; border-radius: 12px; border: 0; cursor: pointer;
    font-size: 17px; font-weight: 800; background: rgba(255,255,255,0.15); color: #fff;
  }
  .levels button.cur { background: var(--gold); color: #04222f; }
  .levels button:disabled { opacity: .3; cursor: default; }
  .stats { display: flex; justify-content: center; gap: 18px; margin: 8px 0; font-size: 15px; }
  .stats div b { display: block; font-size: 20px; color: var(--gold); }
  .shop-row {
    display: flex; align-items: center; gap: 10px; text-align: left;
    padding: 10px; margin: 8px 0; border-radius: 12px; background: rgba(255,255,255,0.07);
  }
  .shop-row .ic { font-size: 28px; width: 36px; text-align: center; }
  .shop-row .tx { flex: 1; font-size: 14px; }
  .shop-row .tx b { font-size: 15px; }
  .pips { display: flex; gap: 3px; margin-top: 4px; }
  .pips i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); }
  .pips i.on { background: var(--accent); }
  .shop-row .btn { font-size: 14px; padding: 9px 10px; min-width: 76px; }
  .small { font-size: 12px; color: #9fbccc; margin-top: 14px; }
  .linkbtn { background: none; border: 0; color: #9fbccc; text-decoration: underline; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <button id="pauseBtn" aria-label="Duraklat">⏸</button>
  <div class="lvl" id="lvlName">Müsilaj Avcısı</div>
  <div class="meter" title="Denizin temizlik oranı">🌊<div class="bar"><i id="cleanBar"></i></div><span id="cleanTxt">%0</span></div>
  <div class="meter" title="Teknenin deposu">🛢️<div class="bar"><i id="tankBar"></i></div></div>
  <div class="money">₺<span id="moneyTxt">0</span></div>
</div>

<div id="toast"></div>
<div id="overlay" class="hidden"><div class="card" id="card"></div></div>

<script>
'use strict';
// ---------- Kurulum ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
let W = 0, H = 0, DPR = 1, hudH = 0;

const STEP = 1 / 30;
const GRID_CELLS = 2400;   // ekran boyutundan bağımsız sabit oyun alanı
const TUNE = { D: 0.1, R: 4, allee: 0.15 };
const COVER_T = 0.15;      // bu yoğunluğun üstü "kirli" sayılır
const WIN_COVER = 0.03;    // %97 temiz = kazan
const LOSE_COVER = 0.92;   // %8 temiz = kaybet

const LEVELS = [
  { name: 'Moda Koyu', blobs: 5, pipes: 2, g: 0.012, emit: 0.7, par: 100,
    desc: 'Kadıköy açıklarında ilk müsilaj lekeleri görüldü. Tekneni hazırla!' },
  { name: 'Adalar', blobs: 7, pipes: 3, g: 0.016, emit: 0.8, par: 140,
    desc: 'Adalar çevresinde müsilaj yayılıyor. Balıklar yüzeye çıkamıyor.' },
  { name: 'İzmit Körfezi', blobs: 9, pipes: 3, g: 0.02, emit: 1.0, par: 200,
    desc: 'Sanayi yoğun körfez: fabrikalardan gelen atıklar müsilajı hızla besliyor.' },
  { name: 'Gemlik Körfezi', blobs: 11, pipes: 4, g: 0.025, emit: 1.1, par: 260,
    desc: 'Sular ısındı, müsilaj daha hızlı büyüyor. Kaynakları erken kes!' },
  { name: 'Tüm Marmara', blobs: 14, pipes: 5, g: 0.03, emit: 1.3, par: 330,
    desc: 'Son görev: bütün Marmara seni bekliyor. Denizi kurtar!' },
];

const FACTS = [
  'Müsilaj (deniz salyası), fitoplankton denen mikroskobik canlıların aşırı çoğalıp salgıladığı yapışkan maddelerden oluşur.',
  'Arıtılmadan denize verilen atık sular azot ve fosfor taşır. Bu maddeler fitoplanktonları besleyerek müsilajı tetikler.',
  'Deniz suyunun ısınması ve akıntının zayıf olması müsilaj oluşumunu hızlandırır.',
  'Müsilaj suyun oksijenini azaltır. Balıklar, midyeler ve dipteki canlılar bundan zarar görür.',
  '2021 baharında Marmara Denizi\'nin geniş bölümleri müsilajla kaplandı ve büyük bir temizlik seferberliği başlatıldı.',
  'Kalıcı çözüm, kaynağı kesmektir: atık suların ileri biyolojik arıtmadan geçirilmesi, yüzeyi temizlemekten daha etkilidir.',
];

const UPG = {
  speed:  { name: 'Motor',       icon: '⚙️', desc: 'Tekne daha hızlı gider',      base: 13,  step: 3 },
  radius: { name: 'Vakum Ağzı',  icon: '🌀', desc: 'Daha geniş alanı temizler',   base: 2.4, step: 0.5 },
  power:  { name: 'Pompa Gücü',  icon: '💪', desc: 'Müsilajı daha hızlı emer',    base: 2.2, step: 0.7 },
  tank:   { name: 'Depo',        icon: '🛢️', desc: 'Daha fazla müsilaj taşır',    base: 90,  step: 45 },
};
const UPG_COST = [60, 130, 220, 340];
const UPG_MAX = UPG_COST.length;

// ---------- Kayıt ----------
const SAVE_KEY = 'musilaj-avcisi-v1';
let save = { level: 0, money: 0, up: { speed: 0, radius: 0, power: 0, tank: 0 } };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && s.up) save = { level: s.level | 0, money: +s.money || 0, up: Object.assign(save.up, s.up) };
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const upv = k => UPG[k].base + UPG[k].step * save.up[k];

// ---------- Düzen ----------
let G = null;
let state = 'menu';

function landHeight() { return clamp(H * 0.1, 60, 96); }
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  hudH = $('hud').offsetHeight;
  if (G) computeView(G);
}
function computeView(g) {
  const landH = landHeight();
  const top = hudH + landH, seaH = H - top;
  const c = Math.min(W / g.gw, seaH / g.gh);
  g.view = { cell: c, ox: (W - g.gw * c) / 2, oy: top + (seaH - g.gh * c) / 2, landTop: hudH, landH, seaTop: top };
}
window.addEventListener('resize', layout);

function makeNoise(gw, gh) {
  let a = new Float32Array(gw * gh).map(() => Math.random());
  for (let pass = 0; pass < 3; pass++) {
    const b = new Float32Array(gw * gh);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      let s = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx >= 0 && yy >= 0 && xx < gw && yy < gh) { s += a[yy * gw + xx]; n++; }
      }
      b[y * gw + x] = s / n;
    }
    a = b;
  }
  let mn = 1, mx = 0;
  for (const v of a) { if (v < mn) mn = v; if (v > mx) mx = v; }
  return a.map(v => (v - mn) / (mx - mn || 1));
}

// ---------- Bölüm oluşturma ----------
function buildLevel(li) {
  const L = LEVELS[li];
  layout();
  const seaH = H - hudH - landHeight();
  const c0 = Math.sqrt(W * seaH / GRID_CELLS);
  const gw = Math.max(24, Math.round(W / c0));
  const gh = Math.max(30, Math.round(seaH / c0));
  const N = gw * gh;
  const g = {
    li, L, gw, gh, N,
    d: new Float32Array(N), tmp: new Float32Array(N), noise: makeNoise(gw, gh),
    sparkle: new Float32Array(N).map(() => Math.random()),
    pipes: [], fish: [], parts: [], wake: [],
    time: 0, coverage: 0, acc: 0, unloadAcc: 0, flags: {}, target: null,
    boat: { x: gw / 2, y: gh - 8, vx: 0, vy: 0, ang: -Math.PI / 2, load: 0 },
    dock: { x: gw / 2, y: gh - 2.5 },
  };
  g.mc = document.createElement('canvas'); g.mc.width = gw; g.mc.height = gh;
  g.mctx = g.mc.getContext('2d'); g.img = g.mctx.createImageData(gw, gh);

  const addBlob = (cx, cy, rad, peak) => {
    for (let y = Math.max(0, Math.floor(cy - rad)); y <= Math.min(gh - 1, Math.ceil(cy + rad)); y++)
      for (let x = Math.max(0, Math.floor(cx - rad)); x <= Math.min(gw - 1, Math.ceil(cx + rad)); x++) {
        const i = y * gw + x;
        const f = 1 - ((x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2) / (rad * rad);
        if (f <= 0) continue;
        const v = Math.min(1, peak * Math.sqrt(f) * (0.75 + 0.5 * g.noise[i]));
        if (v > g.d[i]) g.d[i] = v;
      }
  };
  for (let b = 0; b < L.blobs; b++) {
    let cx, cy, t = 0;
    do { cx = rand(3, gw - 3); cy = rand(3, gh - 8); t++; }
    while (Math.hypot(cx - g.dock.x, cy - g.dock.y) < 12 && t < 30);
    addBlob(cx, cy, rand(5, 9), rand(0.7, 1));
  }
  for (let p = 0; p < L.pipes; p++) {
    const x = clamp((p + 0.5) / L.pipes * gw + rand(-0.12, 0.12) * gw / L.pipes, 2, gw - 2);
    g.pipes.push({ x, type: Math.random() < 0.55 ? 'factory' : 'houses', active: true, cost: 40 + li * 15, flash: 0 });
    addBlob(x, 1, 4, 0.9);
  }
  computeCoverage(g);
  computeView(g);
  for (let k = 0; k < 4; k++) spawnFish(g, true);
  return g;
}

function computeCoverage(g) {
  let c = 0;
  for (let i = 0; i < g.N; i++) if (g.d[i] > COVER_T) c++;
  g.coverage = c / g.N;
}

// ---------- Simülasyon ----------
function update(g, dt) {
  g.time += dt;
  const { gw, gh, L } = g;

  // Müsilaj yayılması (difüzyon + büyüme)
  const d = g.d, out = g.tmp, D = TUNE.D, r = TUNE.R * L.g, al = TUNE.allee;
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
    const i = y * gw + x, v = d[i];
    const n = y > 0 ? d[i - gw] : v, s = y < gh - 1 ? d[i + gw] : v;
    const w = x > 0 ? d[i - 1] : v, e = x < gw - 1 ? d[i + 1] : v;
    // Allee etkisi: çok ince kalan müsilaj kendi kendine büyüyemez
    let nv = v + D * dt * (n + s + w + e - 4 * v) + r * v * (1 - v) * (v - al) * dt;
    if (nv < 0.03) nv -= 0.012 * dt;
    out[i] = nv < 0 ? 0 : nv > 1 ? 1 : nv;
  }
  g.d = out; g.tmp = d;

  // Borulardan gelen atık
  for (const p of g.pipes) {
    p.flash = Math.max(0, p.flash - dt);
    if (!p.active) continue;
    const px = Math.round(p.x);
    for (let dy = 0; dy <= 2; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = px + dx; if (x < 0 || x >= gw) continue;
      const i = dy * gw + x;
      g.d[i] = Math.min(1, g.d[i] + L.emit * dt * (dy === 0 ? 0.25 : 0.12));
    }
    if (Math.random() < dt * 6) g.parts.push({ type: 'drip', x: p.x + rand(-0.4, 0.4), y: 0.2, vx: rand(-0.6, 0.6), vy: rand(1, 2.2), life: 0, max: rand(0.8, 1.4) });
  }

  updateBoat(g, dt);
  updateFish(g, dt);
  updateParts(g, dt);
  computeCoverage(g);

  if (state === 'play' && g.time > 2) {
    if (g.coverage <= WIN_COVER) winLevel();
    else if (g.coverage >= LOSE_COVER) loseLevel();
    else if (g.coverage > 0.75 && !g.flags.warn) { g.flags.warn = true; toast('⚠️ Deniz boğuluyor! Müsilaj çok yayıldı, acele et!'); }
    else if (g.coverage < 0.6) g.flags.warn = false;
  }
}

const keys = {};
function updateBoat(g, dt) {
  const b = g.boat, spd = upv('speed');
  const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  let dx = 0, dy = 0, want = 0;
  if (kx || ky) {
    const m = Math.hypot(kx, ky); dx = kx / m; dy = ky / m; want = spd; g.target = null;
  } else if (g.target) {
    const ex = g.target.x - b.x, ey = g.target.y - b.y, dist = Math.hypot(ex, ey);
    if (dist > 0.25) { dx = ex / dist; dy = ey / dist; want = Math.min(spd, dist * 5); }
  }
  const k = Math.min(1, dt * 6);
  b.vx += (dx * want - b.vx) * k; b.vy += (dy * want - b.vy) * k;
  b.x = clamp(b.x + b.vx * dt, 0.5, g.gw - 0.5);
  b.y = clamp(b.y + b.vy * dt, 0.5, g.gh - 0.5);
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > 0.6) {
    let da = Math.atan2(b.vy, b.vx) - b.ang;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    b.ang += da * Math.min(1, dt * 8);
  }
  if (sp > 2 && Math.random() < dt * 20) g.wake.push({ x: b.x - Math.cos(b.ang) * 1.3, y: b.y - Math.sin(b.ang) * 1.3, life: 0 });

  // Temizleme
  const R = upv('radius'), P = upv('power'), cap = upv('tank');
  let room = cap - b.load, got = 0;
  if (room > 0) {
    const x0 = Math.max(0, Math.floor(b.x - R)), x1 = Math.min(g.gw - 1, Math.ceil(b.x + R));
    const y0 = Math.max(0, Math.floor(b.y - R)), y1 = Math.min(g.gh - 1, Math.ceil(b.y + R));
    for (let y = y0; y <= y1 && room > 0; y++) for (let x = x0; x <= x1 && room > 0; x++) {
      const dd = (x + 0.5 - b.x) ** 2 + (y + 0.5 - b.y) ** 2;
      if (dd >= R * R) continue;
      const i = y * g.gw + x;
      const take = Math.min(g.d[i], P * dt * (1 - 0.6 * dd / (R * R)), room);
      if (take > 0) { g.d[i] -= take; room -= take; got += take; }
    }
    b.load = cap - room;
  }
  if (got > 0.02 && Math.random() < Math.min(1, got * 2)) {
    const a = rand(0, Math.PI * 2), rr = rand(0, R);
    g.parts.push({ type: 'bubble', x: b.x + Math.cos(a) * rr, y: b.y + Math.sin(a) * rr, vx: 0, vy: -0.6, life: 0, max: rand(0.4, 0.8) });
  }
  if (b.load >= cap - 0.01) {
    if (!g.flags.full) { g.flags.full = true; toast('🛢️ Depo dolu! Boşaltmak için limana ⚓ dön.'); }
  } else if (b.load < cap * 0.5) g.flags.full = false;

  // Limanda boşaltma
  if (Math.hypot(b.x - g.dock.x, b.y - g.dock.y) < 4.5 && b.load > 0) {
    const u = Math.min(b.load, 150 * dt);
    b.load -= u; save.money += u; g.unloadAcc += u;
    if (g.unloadAcc >= 8 || b.load <= 0) {
      g.parts.push({ type: 'text', text: '+₺' + Math.round(g.unloadAcc), x: g.dock.x + rand(-1, 1), y: g.dock.y - 2, vx: 0, vy: -2.5, life: 0, max: 1.1 });
      g.unloadAcc = 0;
    }
    if (!g.flags.pipeHint && g.pipes.some(p => p.active && save.money >= p.cost)) {
      g.flags.pipeHint = true;
      toast('💡 Yukarıdaki bir fabrikaya dokun: arıtma tesisi kur, kaynağı kes!');
    }
  }
}

function spawnFish(g, anywhere) {
  for (let t = 0; t < 12; t++) {
    const x = rand(1, g.gw - 1), y = rand(2, g.gh - 2);
    const i = Math.floor(y) * g.gw + Math.floor(x);
    if (anywhere || g.d[i] < 0.1) {
      g.fish.push({
        x, y, ang: rand(0, Math.PI * 2), spd: rand(1.5, 3), size: rand(0.7, 1.3), t: rand(0, 10),
        ph: rand(0, 6), wf: rand(0.5, 1.5), a: 0, dying: false,
        col: ['#ffb347', '#7ee0ff', '#ffd166', '#f78fb3', '#9be564', '#ff8c69'][Math.floor(rand(0, 6))],
      });
      return;
    }
  }
}
function updateFish(g, dt) {
  const target = Math.round(2 + 22 * (1 - g.coverage));
  const alive = g.fish.filter(f => !f.dying);
  if (alive.length < target && Math.random() < dt * 1.5) spawnFish(g, false);
  if (alive.length > target + 1 && Math.random() < dt) alive[Math.floor(Math.random() * alive.length)].dying = true;
  const b = g.boat;
  for (const f of g.fish) {
    f.t += dt;
    f.ang += Math.sin(f.t * f.wf + f.ph) * 0.9 * dt;
    const cx = g.gw / 2 - f.x, cy = g.gh / 2 - f.y;
    if (f.x < 2 || f.x > g.gw - 2 || f.y < 2 || f.y > g.gh - 2) {
      let da = Math.atan2(cy, cx) - f.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); f.ang += da * dt * 3;
    }
    const bd = Math.hypot(f.x - b.x, f.y - b.y);
    let sp = f.spd;
    if (bd < 4) { let da = Math.atan2(f.y - b.y, f.x - b.x) - f.ang; da = Math.atan2(Math.sin(da), Math.cos(da)); f.ang += da * dt * 5; sp *= 2; }
    f.x = clamp(f.x + Math.cos(f.ang) * sp * dt, 0.5, g.gw - 0.5);
    f.y = clamp(f.y + Math.sin(f.ang) * sp * dt, 0.5, g.gh - 0.5);
    f.a = f.dying ? f.a - dt : Math.min(1, f.a + dt);
  }
  g.fish = g.fish.filter(f => !(f.dying && f.a <= 0));
}

function updateParts(g, dt) {
  for (const p of g.parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  g.parts = g.parts.filter(p => p.life < p.max);
  for (const w of g.wake) w.life += dt;
  g.wake = g.wake.filter(w => w.life < 1.2);
}

// ---------- Çizim ----------
function render(g, t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const v = g.view, c = v.cell;
  const sx = x => v.ox + x * c, sy = y => v.oy + y * c;

  // Deniz
  const grd = ctx.createLinearGradient(0, v.seaTop, 0, H);
  grd.addColorStop(0, '#1d7aa5'); grd.addColorStop(1, '#0a3552');
  ctx.fillStyle = grd; ctx.fillRect(0, v.seaTop, W, H - v.seaTop);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 2;
  for (let k = 0; k < 12; k++) {
    const y0 = v.seaTop + (k + 0.5) * (H - v.seaTop) / 12;
    ctx.beginPath();
    for (let x = 0; x <= W + 20; x += 20) {
      const y = y0 + Math.sin(x * 0.02 + t * 0.8 + k * 1.7) * 6;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }

  // Balıklar (müsilajın altında kalır, temizledikçe görünür)
  for (const f of g.fish) {
    const L = f.size * c * 1.4;
    ctx.save(); ctx.translate(sx(f.x), sy(f.y)); ctx.rotate(f.ang);
    ctx.globalAlpha = clamp(f.a, 0, 1);
    ctx.fillStyle = f.col;
    ctx.beginPath(); ctx.ellipse(0, 0, L * 0.5, L * 0.24, 0, 0, Math.PI * 2); ctx.fill();
    const wag = Math.sin(f.t * 10) * L * 0.08;
    ctx.beginPath(); ctx.moveTo(-L * 0.4, 0); ctx.lineTo(-L * 0.75, -L * 0.22 + wag); ctx.lineTo(-L * 0.75, L * 0.22 + wag); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#04222f'; ctx.beginPath(); ctx.arc(L * 0.28, -L * 0.06, Math.max(1.2, L * 0.05), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // Dümen suyu
  for (const w of g.wake) {
    ctx.fillStyle = `rgba(255,255,255,${0.35 * (1 - w.life / 1.2)})`;
    ctx.beginPath(); ctx.arc(sx(w.x), sy(w.y), c * (0.4 + w.life * 1.2), 0, Math.PI * 2); ctx.fill();
  }

  // Müsilaj
  const px = g.img.data, d = g.d;
  for (let i = 0; i < g.N; i++) {
    const val = d[i], n = g.noise[i], o = i * 4;
    const th = clamp((val - 0.02) / 0.55, 0, 1);
    px[o] = 205 + n * 30 - val * 60;
    px[o + 1] = 186 + n * 24 - val * 55;
    px[o + 2] = 112 + n * 20 - val * 50;
    px[o + 3] = th * th * (3 - 2 * th) * 238;
  }
  g.mctx.putImageData(g.img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(g.mc, v.ox, v.oy, g.gw * c, g.gh * c);
  // Yapışkan parıltılar
  ctx.fillStyle = 'rgba(255,248,210,0.35)';
  for (let i = 0; i < g.N; i++) {
    if (g.sparkle[i] < 0.88 || d[i] < 0.45) continue;
    const x = i % g.gw, y = (i / g.gw) | 0;
    ctx.beginPath();
    ctx.ellipse(sx(x + g.noise[i]), sy(y + g.sparkle[i] - 0.4), c * 0.28 * d[i], c * 0.13 * d[i], 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Liman
  const b = g.boat, cap = upv('tank');
  const dkx = sx(g.dock.x), dky = sy(g.dock.y);
  const near = Math.hypot(b.x - g.dock.x, b.y - g.dock.y) < 4.5;
  ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
  ctx.strokeStyle = near && b.load > 0 ? 'rgba(255,209,102,0.9)' : 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(dkx, dky, 4.5 * c, Math.PI, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  if (b.load >= cap - 0.01) {
    ctx.strokeStyle = `rgba(255,209,102,${0.5 + 0.5 * Math.sin(t * 6)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(dkx, dky, 4.5 * c + 4, Math.PI, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = '#8d6748';
  ctx.fillRect(dkx - 1.6 * c, dky - 0.6 * c, 3.2 * c, H - dky + 0.6 * c);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
  for (let yy = dky - 0.6 * c; yy < H; yy += Math.max(5, c * 0.6)) { ctx.beginPath(); ctx.moveTo(dkx - 1.6 * c, yy); ctx.lineTo(dkx + 1.6 * c, yy); ctx.stroke(); }
  ctx.font = `${Math.round(Math.max(16, c * 1.6))}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⚓', dkx, dky + 0.5 * c);

  // Parçacıklar
  for (const p of g.parts) {
    const k = p.life / p.max;
    if (p.type === 'bubble') {
      ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), c * (0.2 + k * 0.35), 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === 'drip') {
      ctx.fillStyle = `rgba(150,120,60,${0.8 * (1 - k)})`;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), c * 0.3, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'clean') {
      ctx.fillStyle = `rgba(150,230,255,${0.9 * (1 - k)})`;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), c * 0.25, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'text') {
      ctx.fillStyle = `rgba(255,209,102,${1 - k})`; ctx.font = `800 ${Math.round(Math.max(15, c * 1.3))}px system-ui`;
      ctx.fillText(p.text, sx(p.x), sy(p.y));
    } else if (p.type === 'confetti') {
      ctx.fillStyle = p.col; ctx.globalAlpha = 1 - k;
      ctx.fillRect(p.x, p.y, 5, 5); ctx.globalAlpha = 1;
    }
  }

  drawBoat(g, sx(b.x), sy(b.y), c, t);

  // Depo doluysa limanı gösteren ok
  if (b.load >= cap - 0.01 && !near) {
    const a = Math.atan2(g.dock.y - b.y, g.dock.x - b.x), r = c * 4.2;
    ctx.save(); ctx.translate(sx(b.x) + Math.cos(a) * r, sy(b.y) + Math.sin(a) * r); ctx.rotate(a);
    ctx.fillStyle = `rgba(255,209,102,${0.7 + 0.3 * Math.sin(t * 8)})`;
    ctx.beginPath(); ctx.moveTo(c * 0.9, 0); ctx.lineTo(-c * 0.5, -c * 0.6); ctx.lineTo(-c * 0.2, 0); ctx.lineTo(-c * 0.5, c * 0.6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  drawLand(g, t);
}

function drawBoat(g, x, y, c, t) {
  const b = g.boat, L = Math.max(c * 3.8, 34), R = upv('radius') * c;
  ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  ctx.save(); ctx.translate(x, y); ctx.rotate(b.ang + Math.sin(t * 3) * 0.02);
  const hull = () => {
    ctx.beginPath(); ctx.moveTo(L * 0.5, 0);
    ctx.quadraticCurveTo(L * 0.35, -L * 0.2, L * 0.1, -L * 0.21);
    ctx.lineTo(-L * 0.45, -L * 0.2); ctx.lineTo(-L * 0.45, L * 0.2); ctx.lineTo(L * 0.1, L * 0.21);
    ctx.quadraticCurveTo(L * 0.35, L * 0.2, L * 0.5, 0); ctx.closePath();
  };
  ctx.save(); ctx.translate(2, 3); ctx.fillStyle = 'rgba(0,0,0,0.25)'; hull(); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#f6f6f2'; hull(); ctx.fill();
  ctx.lineWidth = Math.max(2, L * 0.05); ctx.strokeStyle = '#e76f51'; hull(); ctx.stroke();
  // Depo (doluluk)
  const tx = -L * 0.38, tw = L * 0.38, th = L * 0.26;
  ctx.fillStyle = '#28414f'; ctx.fillRect(tx, -th / 2, tw, th);
  const fill = clamp(b.load / upv('tank'), 0, 1);
  ctx.fillStyle = '#b8964a'; ctx.fillRect(tx, -th / 2, tw * fill, th);
  // Kabin
  ctx.fillStyle = '#2e86c1'; ctx.fillRect(L * 0.03, -L * 0.12, L * 0.2, L * 0.24);
  ctx.fillStyle = '#bfe6ff'; ctx.fillRect(L * 0.17, -L * 0.09, L * 0.05, L * 0.18);
  ctx.restore();
}

function drawLand(g, t) {
  const v = g.view, lt = v.landTop, lh = v.landH, c = v.cell;
  ctx.fillStyle = '#4f9a5e'; ctx.fillRect(0, lt, W, lh);
  ctx.fillStyle = '#e6cf98';
  ctx.beginPath(); ctx.moveTo(0, v.seaTop);
  for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, lt + lh * 0.76 + Math.sin(x * 0.045) * 3);
  ctx.lineTo(W, v.seaTop); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W + 10; x += 10) { const y = v.seaTop + 2 + Math.sin(x * 0.06 + t * 2) * 1.5; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();

  const n = g.pipes.length;
  for (const p of g.pipes) {
    const x = v.ox + p.x * c;
    const bw = Math.min(lh * 0.95, W / n * 0.7), bh = lh * 0.5, by = lt + lh * 0.12;
    // Boru
    ctx.fillStyle = '#7f8c8d'; ctx.fillRect(x - c * 0.35, by + bh - 2, c * 0.7, v.seaTop - (by + bh) + c * 0.4);
    if (p.active) {
      ctx.fillStyle = '#8a6d36'; ctx.beginPath(); ctx.ellipse(x, v.seaTop + c * 0.5, c * 0.55, c * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    } else if (Math.random() < 0.3) {
      g.parts.push({ type: 'clean', x: p.x + rand(-0.3, 0.3), y: 0.4, vx: rand(-0.8, 0.8), vy: rand(1, 2), life: 0, max: 0.8 });
    }
    ctx.save(); ctx.translate(x, by);
    if (!p.active) {
      ctx.fillStyle = '#dff3ea'; ctx.fillRect(-bw / 2, bh * 0.2, bw, bh * 0.8);
      ctx.fillStyle = '#4fb3d9';
      ctx.beginPath(); ctx.arc(-bw * 0.22, bh * 0.6, bh * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(bw * 0.22, bh * 0.6, bh * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a9e92'; ctx.font = `800 ${Math.round(bh * 0.4)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('♻', 0, bh * 0.6);
    } else if (p.type === 'factory') {
      ctx.fillStyle = '#95a5a6'; ctx.fillRect(bw * 0.22, -bh * 0.1, bw * 0.12, bh * 0.5);
      for (let k = 0; k < 3; k++) {
        const ph = (t * 0.6 + k / 3) % 1;
        ctx.fillStyle = `rgba(90,90,90,${0.5 * (1 - ph)})`;
        ctx.beginPath(); ctx.arc(bw * 0.28 + ph * 10, -bh * 0.15 - ph * bh * 0.5, 3 + ph * 6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#6c7a89';
      ctx.beginPath(); ctx.moveTo(-bw / 2, bh);
      const teeth = 3;
      for (let k = 0; k < teeth; k++) { const x0 = -bw / 2 + k * bw / teeth; ctx.lineTo(x0, bh * 0.3); ctx.lineTo(x0 + bw / teeth, bh * 0.05); ctx.lineTo(x0 + bw / teeth, bh * 0.3); }
      ctx.lineTo(bw / 2, bh); ctx.closePath(); ctx.fill();
    } else {
      for (let k = 0; k < 3; k++) {
        const hx = -bw / 2 + k * bw / 3 + bw * 0.03, hw = bw / 3 - bw * 0.06;
        ctx.fillStyle = '#f1e3c6'; ctx.fillRect(hx, bh * 0.45, hw, bh * 0.55);
        ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(hx - 2, bh * 0.47); ctx.lineTo(hx + hw / 2, bh * 0.1); ctx.lineTo(hx + hw + 2, bh * 0.47); ctx.closePath(); ctx.fill();
      }
    }
    // Rozet
    const label = p.active ? `🔧 ₺${p.cost}` : '✓ Arıtma';
    ctx.font = `700 ${Math.round(clamp(lh * 0.17, 11, 14))}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(label).width + 12, ty = bh + lh * 0.2;
    const afford = p.active && save.money >= p.cost;
    ctx.fillStyle = p.flash > 0 ? 'rgba(231,111,81,0.95)' : afford ? `rgba(46,196,182,${0.8 + 0.2 * Math.sin(t * 5)})` : p.active ? 'rgba(8,36,56,0.85)' : 'rgba(26,158,146,0.9)';
    roundRect(-tw / 2, ty - 10, tw, 20, 10); ctx.fill();
    ctx.fillStyle = afford ? '#04222f' : '#fff'; ctx.fillText(label, 0, ty + 1);
    ctx.restore();
  }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- HUD & mesajlar ----------
let lastHud = '';
function updateHUD() {
  if (!G) return;
  const clean = Math.round((1 - G.coverage) * 100);
  const cap = upv('tank'), fill = clamp(G.boat.load / cap, 0, 1);
  const key = clean + '|' + Math.round(fill * 50) + '|' + Math.floor(save.money);
  if (key === lastHud) return;
  lastHud = key;
  $('cleanBar').style.width = clean + '%';
  $('cleanTxt').textContent = '%' + clean;
  $('tankBar').style.width = fill * 100 + '%';
  $('tankBar').classList.toggle('full', fill >= 0.999);
  $('moneyTxt').textContent = Math.floor(save.money);
}
let toastTimer = 0;
function toast(msg, ms = 2800) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// ---------- Ekranlar ----------
let onBack = null;
function show(html) { $('card').innerHTML = html; $('overlay').classList.remove('hidden'); $('card').scrollTop = 0; }
function hide() { $('overlay').classList.add('hidden'); }

function preview(li) {
  G = buildLevel(li);
  $('lvlName').textContent = `${li + 1}. Bölüm · ${LEVELS[li].name}`;
  lastHud = '';
}

function showMenu() {
  state = 'menu';
  if (!G) preview(save.level);
  const lv = LEVELS.map((L, i) => `<button data-a="pick" data-i="${i}" class="${i === save.level ? 'cur' : ''}" ${i > save.level ? 'disabled' : ''} title="${L.name}">${i + 1}</button>`).join('');
  show(`
    <div class="big">🚤🌊</div>
    <h1>Müsilaj <span>Avcısı</span></h1>
    <p>Marmara deniz salyasıyla kaplanıyor! Tekneni sür, müsilajı topla, kaynağını kes.</p>
    <ul class="how">
      <li><b>Sürükle</b> (veya ok tuşları/WASD): tekneyi yönet, müsilajı emerek topla.</li>
      <li>Depo dolunca <b>limana ⚓</b> dön; topladığını boşaltınca para kazanırsın.</li>
      <li>Kıyıdaki <b>fabrikalara dokun</b> ve arıtma tesisi kur. Kaynak kesilmezse müsilaj geri gelir!</li>
      <li>Denizi <b>%97 temizle</b>, balıkları geri getir.</li>
    </ul>
    <div class="btns">
      <button class="btn" data-a="play">${save.level > 0 ? 'Devam Et' : 'Oyna'} · ${save.level + 1}. Bölüm</button>
      <button class="btn alt" data-a="shop">🔧 Atölye (₺${Math.floor(save.money)})</button>
    </div>
    <div class="levels">${lv}</div>
    <div class="small"><button class="linkbtn" data-a="reset">İlerlemeyi sıfırla</button></div>
  `);
  onBack = showMenu;
}

function showIntro(li) {
  preview(li);
  state = 'intro';
  const L = LEVELS[li];
  show(`
    <div class="big">🗺️</div>
    <h2>${li + 1}. Bölüm: ${L.name}</h2>
    <p>${L.desc}</p>
    <div class="stats">
      <div><b>${L.pipes}</b>atık kaynağı</div>
      <div><b>%97</b>hedef temizlik</div>
      <div><b>${L.par} sn</b>3 yıldız süresi</div>
    </div>
    <div class="btns"><button class="btn" data-a="start">Başla!</button><button class="btn alt" data-a="menu">Menü</button></div>
  `);
}

function startPlay() {
  hide(); state = 'play';
  if (G.li === 0 && !G.flags.intro) { G.flags.intro = true; toast('👆 Tekneyi sürükleyerek müsilajın üzerinden geç!', 3500); }
}

function winLevel() {
  state = 'end';
  const g = G, L = g.L, tm = Math.round(g.time);
  const stars = tm <= L.par ? 3 : tm <= L.par * 1.6 ? 2 : 1;
  const bonus = 40 + g.li * 20 + stars * 20;
  save.money += bonus;
  const last = g.li === LEVELS.length - 1;
  if (!last && save.level <= g.li) save.level = g.li + 1;
  nextLi = Math.min(g.li + 1, LEVELS.length - 1);
  persist();
  for (let k = 0; k < 60; k++) g.parts.push({ type: 'confetti', x: rand(0, W), y: rand(-20, H * 0.4), vx: rand(-40, 40), vy: rand(60, 160), life: 0, max: rand(1.5, 3), col: ['#ffd166', '#2ec4b6', '#f78fb3', '#7ee0ff'][k % 4] });
  const fact = FACTS[g.li % FACTS.length];
  if (last) {
    show(`
      <div class="big">🏆🐟🐬</div>
      <h2>Marmara Kurtuldu!</h2>
      <p>Bütün bölgeleri temizledin ve atık kaynaklarını kestin. Balıklar geri döndü!</p>
      <div class="stats"><div><b>${'⭐'.repeat(stars)}</b>yıldız</div><div><b>${tm} sn</b>süre</div><div><b>+₺${bonus}</b>ödül</div></div>
      <div class="fact"><b>📘 Unutma</b>${FACTS[5]}</div>
      <div class="btns"><button class="btn gold" data-a="replay">Bu Bölümü Tekrar Oyna</button><button class="btn alt" data-a="menu">Menü</button></div>
    `);
  } else {
    show(`
      <div class="big">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <h2>${L.name} temizlendi!</h2>
      <div class="stats"><div><b>${tm} sn</b>süre</div><div><b>+₺${bonus}</b>ödül</div><div><b>₺${Math.floor(save.money)}</b>bakiye</div></div>
      <div class="fact"><b>📘 Biliyor muydun?</b>${fact}</div>
      <div class="btns"><button class="btn" data-a="next">Sonraki Bölüm ▶</button><button class="btn alt" data-a="shop">🔧 Atölye</button></div>
    `);
  }
  onBack = () => winBackScreen(last);
}
function winBackScreen(last) {
  if (last) return showMenu();
  show(`
    <h2>Hazır mısın?</h2>
    <p>Sıradaki durak: <b>${LEVELS[nextLi].name}</b></p>
    <div class="btns"><button class="btn" data-a="next">Sonraki Bölüm ▶</button><button class="btn alt" data-a="shop">🔧 Atölye (₺${Math.floor(save.money)})</button></div>
  `);
  onBack = () => winBackScreen(last);
}

function loseLevel() {
  state = 'end'; persist();
  show(`
    <div class="big">😵🐟</div>
    <h2>Deniz müsilajla kaplandı</h2>
    <p>Müsilaj çok hızlı yayıldı. Önce atık kaynaklarını kesmeyi dene, ya da atölyede tekneni geliştir.</p>
    <div class="fact"><b>📘 Biliyor muydun?</b>${FACTS[3]}</div>
    <div class="btns"><button class="btn" data-a="retry">Tekrar Dene</button><button class="btn alt" data-a="shop">🔧 Atölye (₺${Math.floor(save.money)})</button><button class="btn alt" data-a="menu">Menü</button></div>
  `);
  onBack = loseLevelBack;
}
function loseLevelBack() {
  show(`
    <h2>Tekrar deneyelim!</h2>
    <div class="btns"><button class="btn" data-a="retry">Tekrar Dene</button><button class="btn alt" data-a="shop">🔧 Atölye (₺${Math.floor(save.money)})</button><button class="btn alt" data-a="menu">Menü</button></div>
  `);
  onBack = loseLevelBack;
}

function showPause() {
  if (state !== 'play') return;
  state = 'paused';
  show(`
    <div class="big">⏸</div><h2>Duraklatıldı</h2>
    <div class="btns"><button class="btn" data-a="resume">Devam Et</button><button class="btn alt" data-a="retry">Bölümü Yeniden Başlat</button><button class="btn alt" data-a="menu">Menü</button></div>
  `);
}

function showShop() {
  const prev = state;
  state = 'shop';
  const rows = Object.keys(UPG).map(k => {
    const u = UPG[k], lv = save.up[k], maxed = lv >= UPG_MAX, cost = UPG_COST[lv];
    const pips = Array.from({ length: UPG_MAX }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('');
    return `<div class="shop-row"><div class="ic">${u.icon}</div><div class="tx"><b>${u.name}</b><br>${u.desc}<div class="pips">${pips}</div></div>
      <button class="btn gold" data-a="buy" data-k="${k}" ${maxed || save.money < cost ? 'disabled' : ''}>${maxed ? 'MAKS' : '₺' + cost}</button></div>`;
  }).join('');
  show(`
    <h2>🔧 Atölye</h2>
    <p>Bakiye: <b style="color:var(--gold)">₺${Math.floor(save.money)}</b></p>
    ${rows}
    <div class="btns"><button class="btn" data-a="back">Geri</button></div>
  `);
  if (prev !== 'shop') shopReturnState = prev;
}
let shopReturnState = 'menu';
let nextLi = 0;

$('overlay').addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a;
  if (a === 'play') showIntro(save.level);
  else if (a === 'pick') showIntro(+el.dataset.i);
  else if (a === 'start' || a === 'resume') startPlay();
  else if (a === 'menu') { G = null; showMenu(); }
  else if (a === 'next') showIntro(nextLi);
  else if (a === 'retry' || a === 'replay') showIntro(G.li);
  else if (a === 'shop') showShop();
  else if (a === 'buy') {
    const k = el.dataset.k, cost = UPG_COST[save.up[k]];
    if (save.up[k] < UPG_MAX && save.money >= cost) { save.money -= cost; save.up[k]++; persist(); }
    showShop();
  } else if (a === 'back') { state = shopReturnState; (onBack || showMenu)(); }
  else if (a === 'reset') {
    if (confirm('Tüm ilerleme ve para silinsin mi?')) {
      save = { level: 0, money: 0, up: { speed: 0, radius: 0, power: 0, tank: 0 } }; persist(); G = null; showMenu();
    }
  }
});
$('pauseBtn').addEventListener('click', showPause);

// ---------- Girdi ----------
let dragging = false;
function setTarget(e) {
  const v = G.view;
  G.target = { x: clamp((e.clientX - v.ox) / v.cell, 0.5, G.gw - 0.5), y: clamp((e.clientY - v.oy) / v.cell, 0.5, G.gh - 0.5) };
}
function tryPipe(x, y) {
  const v = G.view, n = G.pipes.length;
  const bw = Math.min(v.landH * 0.95, W / n * 0.7);
  for (const p of G.pipes) {
    if (Math.abs(x - (v.ox + p.x * v.cell)) > bw / 2 + 10) continue;
    if (!p.active) { toast('Burada zaten bir arıtma tesisi var ♻'); return true; }
    if (save.money >= p.cost) {
      save.money -= p.cost; p.active = false;
      for (let k = 0; k < 30; k++) G.parts.push({ type: 'confetti', x: x + rand(-20, 20), y: y, vx: rand(-90, 90), vy: rand(-120, 40), life: 0, max: rand(0.6, 1.2), col: ['#2ec4b6', '#ffd166', '#7ee0ff'][k % 3] });
      toast('♻ Arıtma tesisi kuruldu! Bu kaynaktan artık müsilaj gelmeyecek.');
    } else {
      p.flash = 0.6;
      toast(`₺${p.cost} gerekiyor. Müsilajı limana taşıyıp para kazan!`);
    }
    return true;
  }
  return false;
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || !G) return;
  if (e.clientY < G.view.seaTop + G.view.cell * 1.2 && tryPipe(e.clientX, e.clientY)) return;
  if (e.clientY < G.view.seaTop) return;
  dragging = true;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  setTarget(e);
});
cv.addEventListener('pointermove', e => { if (dragging && state === 'play') setTarget(e); });
const endDrag = () => { dragging = false; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'play') showPause(); else if (state === 'paused') { hide(); state = 'play'; } }
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) showPause(); });

// ---------- Döngü ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G) {
    if (state === 'play') {
      G.acc += dt;
      while (G.acc >= STEP && state === 'play') { update(G, STEP); G.acc -= STEP; }
    } else {
      updateFish(G, dt); updateParts(G, dt);
    }
    render(G, now / 1000);
    updateHUD();
  }
  requestAnimationFrame(frame);
}

layout();
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
