<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fener ve Aynalar</title>
<meta name="description" content="Aynaları çevir, fenerleri yak, her ışığı kendi rengindeki hedefe ulaştır. 15 bölümlük yansıma bulmacası.">
<meta name="theme-color" content="#070b1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: night harbour scene; brass-framed puzzle table in the middle, outer ring holds lanterns, targets and the switch */
  :root {
    color-scheme: dark;
    --night-0: #050816;
    --night-1: #0b1230;
    --night-2: #17224f;
    --slate: #1a2347;
    --slate-hi: #263266;
    --brass: #c99a4b;
    --brass-hi: #f3d08a;
    --brass-lo: #6e4f1f;
    --ink: #eef1ff;
    --muted: #9aa5d4;
    --gold: #ffd166;
    --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --c: min(calc((100vw - 72px) / 6), calc((100dvh - 250px) / 6), 88px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--night-0);
    color: var(--ink);
    font-family: var(--body);
    user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; align-items: center;
    padding-block: calc(10px + env(safe-area-inset-top, 0px)) 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid var(--brass-hi); outline-offset: 2px; }

  /* ---------- background scene ---------- */
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -3; display: block; }
  .moon {
    position: fixed; z-index: -2; top: 7vh; right: 9vw; width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #fffbe8, #f4e3b0 55%, #d9c387);
    box-shadow: 0 0 40px 10px rgba(255, 238, 190, .25), 0 0 120px 40px rgba(255, 238, 190, .08);
  }
  .moon::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 60%, rgba(150,130,80,.25) 7px, transparent 8px),
      radial-gradient(circle at 62% 30%, rgba(150,130,80,.2) 5px, transparent 6px),
      radial-gradient(circle at 66% 68%, rgba(150,130,80,.18) 9px, transparent 10px);
  }
  .sea { position: fixed; left: 0; right: 0; bottom: 0; height: 26vh; z-index: -2; pointer-events: none; }
  .sea svg { position: absolute; bottom: 0; width: 200%; height: 100%; }
  .sea .w1 { animation: drift 26s linear infinite; opacity: .9; }
  .sea .w2 { animation: drift 18s linear infinite reverse; opacity: .7; bottom: -10px; }
  @keyframes drift { to { transform: translateX(-50%); } }
  .lighthouse { position: fixed; left: 4vw; bottom: 9vh; width: 70px; z-index: -2; overflow: visible; }
  .lighthouse .sweep { transform-origin: 35px 22px; animation: sweep 7s ease-in-out infinite; }
  @keyframes sweep { 0%,100% { transform: rotate(-25deg); opacity: .5; } 50% { transform: rotate(25deg); opacity: .9; } }
  @media (max-width: 600px) { .moon { display: none; } .lighthouse { width: 52px; } .chip { font-size: 13px; padding: 7px 9px 5px; } }
  .vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55)); }

  /* ---------- header ---------- */
  header { width: 100%; max-width: calc(var(--c) * 6 + 24px); display: flex; align-items: center; gap: 10px; }
  .brand { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand svg { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 0 6px rgba(255,190,90,.6)); }
  h1 {
    font-family: var(--display); font-weight: 800; font-size: clamp(19px, 5.4vw, 26px); line-height: 1; margin: 0; white-space: nowrap;
    background: linear-gradient(180deg, #fff6dc, var(--brass-hi) 50%, var(--brass)); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 2px 14px rgba(243,208,138,.25);
  }
  .chip {
    font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1;
    background: rgba(12, 18, 46, .7); border: 1px solid rgba(243,208,138,.25);
    border-radius: 999px; padding: 8px 12px 6px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .iconbtn {
    background: rgba(12, 18, 46, .7); border: 1px solid rgba(243,208,138,.25); color: var(--brass-hi);
    border-radius: 12px; width: 36px; height: 36px; cursor: pointer; display: grid; place-items: center; flex: none;
  }
  .iconbtn svg { width: 18px; height: 18px; }
  .iconbtn:active { transform: scale(.93); }

  #levelInfo { margin: 12px 0 4px; display: flex; align-items: center; gap: 10px; font-family: var(--display); }
  #levelInfo .n { font-size: 20px; font-weight: 800; }
  #levelInfo .lights { display: flex; gap: 5px; align-self: center; }
  #levelInfo .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: 0 0 8px currentColor; background: currentColor; }
  #levels { display: flex; gap: 5px; margin: 4px 0 8px; flex-wrap: wrap; justify-content: center; max-width: calc(var(--c) * 6 + 24px); }
  #levels button {
    width: 30px; height: 30px; border-radius: 9px; border: 1px solid rgba(255,255,255,.1);
    background: rgba(12, 18, 46, .7); color: var(--muted); font-family: var(--display); font-weight: 700; font-size: 13px; cursor: pointer;
    position: relative; padding: 0;
  }
  #levels button.done { color: var(--gold); border-color: rgba(255,209,102,.4); }
  #levels button.done::after { content: attr(data-stars); position: absolute; left: 0; right: 0; bottom: -9px; font-size: 7px; letter-spacing: -1px; color: var(--gold); }
  #levels button.cur { background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: #2a1a04; border-color: transparent; }
  #levels button:disabled { opacity: .3; cursor: default; }
  #hint { font-size: 14px; color: var(--muted); margin: 8px 0 12px; text-align: center; min-height: 20px; max-width: calc(var(--c) * 6); text-wrap: balance; }
  #hint b { color: var(--ink); }

  /* ---------- board ---------- */
  #table {
    position: relative; padding: 12px; border-radius: 26px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.07), transparent 60%),
      linear-gradient(160deg, #1b2552, #0e1536 70%);
    box-shadow:
      0 0 0 2px var(--brass-lo), 0 0 0 4px var(--brass), 0 0 0 5px var(--brass-hi), 0 0 0 7px var(--brass-lo),
      0 30px 80px rgba(0,0,0,.65), inset 0 0 40px rgba(0,0,0,.5);
  }
  .rivet { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--brass-hi), var(--brass) 60%, var(--brass-lo)); box-shadow: 0 1px 2px rgba(0,0,0,.6); z-index: 6; }
  #board {
    position: relative;
    width: calc(var(--c) * 6); height: calc(var(--c) * 6);
    display: grid; grid-template-columns: repeat(6, var(--c)); grid-template-rows: repeat(6, var(--c));
  }
  #board::before {
    content: ""; position: absolute;
    left: calc(var(--c) - 7px); top: calc(var(--c) - 7px);
    width: calc(var(--c) * 4 + 14px); height: calc(var(--c) * 4 + 14px);
    border-radius: 16px; background: #070b1f;
    box-shadow: inset 0 6px 18px rgba(0,0,0,.8), 0 0 0 1px rgba(243,208,138,.25), 0 1px 0 rgba(255,255,255,.06);
  }
  .cell { position: relative; display: grid; place-items: center; z-index: 1; }
  .cell.out { z-index: 4; }
  .tile {
    width: calc(100% - 6px); height: calc(100% - 6px); border-radius: 11px; position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.07), transparent 55%),
      linear-gradient(150deg, var(--slate-hi), var(--slate));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -3px 0 rgba(0,0,0,.3);
    transition: box-shadow .25s, filter .15s;
  }
  .tile.rot { cursor: pointer; }
  .tile.rot::before {   /* rotate hint arc */
    content: ""; position: absolute; right: 5px; top: 5px; width: 9px; height: 9px; border: 2px solid rgba(243,208,138,.45);
    border-left-color: transparent; border-bottom-color: transparent; border-radius: 50%;
  }
  @media (hover: hover) { .tile.rot:hover { filter: brightness(1.18); } }
  .tile.rot:active { transform: scale(.95); }
  .mirror {
    position: absolute; left: 50%; top: 50%; width: 112%; height: 13%; border-radius: 5px;
    background: linear-gradient(180deg, #ffffff 0%, #d7ecfb 40%, #7f9db6 52%, #eef8ff 100%);
    box-shadow: 0 0 0 1.5px #3b4a6a, 0 4px 8px rgba(0,0,0,.45);
    transform: translate(-50%, -50%) rotate(var(--a));
    transition: transform .3s cubic-bezier(.3,1.6,.5,1), box-shadow .25s;
  }
  .tile.lit { box-shadow: inset 0 0 22px -4px var(--glow), inset 0 1px 0 rgba(255,255,255,.08); }
  .tile.lit .mirror { box-shadow: 0 0 0 1.5px #3b4a6a, 0 0 16px 4px var(--glow); }
  .tile.locked { background: linear-gradient(150deg, #34374f, #1f2236); }
  .tile.locked::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 9px 9px, #8b8fa8 2.5px, #4a4e66 3.5px, transparent 4px),
      radial-gradient(circle at calc(100% - 9px) 9px, #8b8fa8 2.5px, #4a4e66 3.5px, transparent 4px),
      radial-gradient(circle at 9px calc(100% - 9px), #8b8fa8 2.5px, #4a4e66 3.5px, transparent 4px),
      radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), #8b8fa8 2.5px, #4a4e66 3.5px, transparent 4px);
  }
  .tile.locked .mirror { background: linear-gradient(180deg, #e4e6ee, #9a9fb4 50%, #cdd0dc); }
  .tile.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .tile.wall {
    background:
      linear-gradient(0deg, transparent 31%, rgba(0,0,0,.4) 31% 35%, transparent 35% 64%, rgba(0,0,0,.4) 64% 68%, transparent 68%),
      linear-gradient(90deg, transparent 47%, rgba(0,0,0,.4) 47% 53%, transparent 53%) 0 0 / 100% 33%,
      linear-gradient(90deg, transparent 22%, rgba(0,0,0,.4) 22% 28%, transparent 28% 72%, rgba(0,0,0,.4) 72% 78%, transparent 78%) 0 50% / 100% 33% no-repeat,
      linear-gradient(150deg, #6d5845, #3f3228);
  }

  .lantern, .target { width: 80%; height: 80%; position: relative; }
  .lantern svg, .target svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .lantern { transform: rotate(var(--r)); }
  .lantern .lens { transition: opacity .3s; opacity: .45; }
  .lantern .halo { transition: opacity .3s; opacity: 0; }
  .lantern.on .lens { opacity: 1; }
  .lantern.on .halo { opacity: .8; }
  .target .gem { transition: fill .3s; }
  .target .ring { transform-origin: center; }
  .target.hit .gem { fill: var(--col); }
  .target.hit { animation: pulse 1.1s ease-in-out infinite; }
  .target.hit .ring { animation: spin 4s linear infinite; }
  @keyframes pulse { 50% { filter: drop-shadow(0 0 14px var(--col)) brightness(1.25); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  #power {
    width: 80%; height: 80%; border-radius: 50%; cursor: pointer; position: relative; padding: 0;
    border: 3px solid var(--brass);
    background: radial-gradient(circle at 35% 30%, #ff8f80, #d63a2f 55%, #8c1c16);
    box-shadow: 0 0 0 3px var(--brass-lo), 0 6px 0 #4a0d0a, 0 10px 18px rgba(0,0,0,.55), inset 0 2px 3px rgba(255,255,255,.4);
    color: #fff; display: grid; place-items: center; transition: transform .08s, box-shadow .08s, background .3s;
  }
  #power svg { width: 46%; height: 46%; }
  #power:active { transform: translateY(4px); box-shadow: 0 0 0 3px var(--brass-lo), 0 2px 0 #4a0d0a, 0 4px 8px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.4); }
  #power.on {
    background: radial-gradient(circle at 35% 30%, #b4ffc4, #2ecc71 55%, #157a3f);
    box-shadow: 0 0 0 3px var(--brass-lo), 0 6px 0 #0b4022, 0 0 30px rgba(46,204,113,.65), inset 0 2px 3px rgba(255,255,255,.4);
  }
  #power.nudge { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { box-shadow: 0 0 0 3px var(--brass-lo), 0 6px 0 #4a0d0a, 0 0 26px 6px rgba(255,120,100,.55), inset 0 2px 3px rgba(255,255,255,.4); } }

  #beams { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }

  footer { margin-top: 18px; display: flex; gap: 10px; }
  .btn {
    font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1;
    background: rgba(12, 18, 46, .75); color: var(--ink); border: 1px solid rgba(243,208,138,.3);
    border-radius: 14px; padding: 11px 18px 9px; cursor: pointer;
  }
  .btn.primary { background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: #2a1a04; border-color: transparent; box-shadow: 0 4px 0 var(--brass-lo); }
  .btn:active { transform: translateY(2px); }
  .btn:disabled { opacity: .35; cursor: default; }

  #win { position: fixed; inset: 0; display: none; place-items: center; z-index: 10; background: rgba(3, 5, 15, .55); backdrop-filter: blur(5px); padding: 16px; }
  #win.show { display: grid; animation: fade .3s; }
  @keyframes fade { from { opacity: 0; } }
  .card {
    background: linear-gradient(170deg, #1d2858, #0d1435); border-radius: 22px;
    padding: 26px 26px 24px; text-align: center; width: min(330px, 100%);
    box-shadow: 0 0 0 2px var(--brass-lo), 0 0 0 4px var(--brass), 0 0 0 5px var(--brass-hi), 0 30px 80px rgba(0,0,0,.7);
    animation: pop .4s cubic-bezier(.3,1.6,.5,1);
  }
  @keyframes pop { from { transform: scale(.8); } }
  .card h2 { font-family: var(--display); margin: 0 0 4px; font-size: 28px; line-height: 1.1; color: var(--brass-hi); }
  .card p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .stars { font-size: 40px; letter-spacing: 8px; margin-bottom: 16px; }
  .stars span { display: inline-block; animation: starIn .45s cubic-bezier(.3,1.8,.5,1) backwards; }
  .stars span:nth-child(2) { animation-delay: .15s; } .stars span:nth-child(3) { animation-delay: .3s; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); } }
  .stars .off { color: #333d6e; }
  .stars .on { color: var(--gold); text-shadow: 0 0 16px rgba(255,209,102,.7); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="moon"></div>
<svg class="lighthouse" viewBox="0 0 70 150" aria-hidden="true">
  <path class="sweep" d="M35 22 L-260 -20 L-260 64 Z" fill="rgba(255,236,170,.09)"/>
  <path class="sweep" d="M35 22 L330 -20 L330 64 Z" fill="rgba(255,236,170,.09)"/>
  <path d="M0 150 Q8 128 22 130 Q35 120 50 130 Q64 128 70 150 Z" fill="#0a0f26"/>
  <path d="M24 40 H46 L52 132 H18 Z" fill="#d9dbe6"/>
  <path d="M23.3 52 H46.7 L47.6 66 H22.4 Z M21.9 80 H48.1 L49 94 H21 Z M20.4 108 H49.6 L50.5 122 H19.5 Z" fill="#b8323b"/>
  <path d="M24 40 H35 L33 132 H18 Z" fill="#000" opacity=".18"/>
  <rect x="19" y="34" width="32" height="6" rx="1" fill="#1a1f3d"/>
  <rect x="26" y="14" width="18" height="20" rx="2" fill="#ffe9a8"/>
  <path d="M30 14 V34 M35 14 V34 M40 14 V34" stroke="#c9a65a" stroke-width="1"/>
  <path d="M22 14 L35 2 L48 14 Z" fill="#b8323b"/>
  <circle cx="35" cy="24" r="16" fill="#ffe9a8" opacity=".25"/>
</svg>
<div class="sea" aria-hidden="true">
  <svg class="w1" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 50 Q75 30 150 50 T300 50 T450 50 T600 50 T750 50 T900 50 T1050 50 T1200 50 V120 H0 Z" fill="#0a1433"/></svg>
  <svg class="w2" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 70 Q100 50 200 70 T400 70 T600 70 T800 70 T1000 70 T1200 70 V120 H0 Z" fill="#060c24"/></svg>
</div>
<div class="vignette"></div>
<canvas id="fx"></canvas>

<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 6h10l-1 3h-8z" fill="#c99a4b"/><rect x="9" y="9" width="14" height="16" rx="3" fill="#2b2f4f" stroke="#f3d08a" stroke-width="2"/><rect x="12.5" y="12" width="7" height="10" rx="2" fill="#ffc861"/><path d="M8 25h16v3H8z" fill="#c99a4b"/><path d="M16 2v4" stroke="#f3d08a" stroke-width="2" stroke-linecap="round"/></svg>
    <h1>Fener &amp; Aynalar</h1>
  </div>
  <button class="iconbtn" id="soundBtn" title="Ses" aria-label="Sesi aç/kapat"></button>
  <button class="iconbtn" id="resetBtn" title="Bölümü sıfırla" aria-label="Bölümü sıfırla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
</header>
<div id="levelInfo"><span class="n" id="levelTitle"></span><span class="lights" id="levelLights"></span><span class="chip" id="moves">Hamle 0</span></div>
<div id="levels"></div>
<p id="hint"></p>
<div id="table">
  <div id="board">
    <svg id="beams" viewBox="0 0 600 600" preserveAspectRatio="none">
      <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter></defs>
    </svg>
  </div>
</div>
<footer>
  <button class="btn" id="prevBtn">‹ Önceki</button>
  <button class="btn" id="nextBtn">Sonraki ›</button>
</footer>

<div id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="card">
    <h2 id="winTitle">Işıklar hedefte!</h2>
    <p id="winText"></p>
    <div class="stars" id="stars"></div>
    <button class="btn primary" id="winNext">Sonraki bölüm</button>
  </div>
</div>

<script>
(() => {
  const N = 4;
  const PALETTE = {
    mavi:   '#4cc9ff',
    kırmızı:'#ff5468',
    yeşil:  '#4dff9a',
    sarı:   '#ffc23d',
    mor:    '#b58cff',
    pembe:  '#ff74d4',
  };
  // grid: '.' empty, '/' '\' rotatable mirror, 'a' locked '/', 'b' locked '\', '#' stone block
  // lanterns: side (L/R/T/B) + index; targets[i] is where lantern i must land; colors[i] its light colour
  const LEVELS = [
    { grid: ["....","....","....","\\.\\."], lanterns: [{s:"T",i:2}], targets: ["B0"], colors: ["mavi"],
      hint: "Aynalara dokunup çevir, sonra köşedeki <b>düğmeye</b> bas." },
    { grid: ["....","\\.\\.",".#..","../."], lanterns: [{s:"B",i:0}], targets: ["R3"], colors: ["sarı"],
      hint: "Taş bloklar ışığı keser." },
    { grid: [".a..","....","...\\",".#//"], lanterns: [{s:"T",i:2}], targets: ["R2"], colors: ["yeşil"],
      hint: "Vidalı aynalar sabittir, çevrilemez." },
    { grid: ["b.#.","../.",".#//",".../"], lanterns: [{s:"R",i:3}], targets: ["R1"], colors: ["kırmızı"] },
    { grid: ["....","#\\\\\\","....","\\./."], lanterns: [{s:"B",i:0},{s:"B",i:3}], targets: ["B1","R1"], colors: ["mavi","kırmızı"],
      hint: "İki fener! Her ışık <b>kendi rengindeki</b> hedefe gitmeli." },
    { grid: ["\\.\\.",".\\./","//..","##b."], lanterns: [{s:"R",i:3}], targets: ["B3"], colors: ["mor"] },
    { grid: ["..\\/","/..\\",".#..","\\/.a"], lanterns: [{s:"B",i:1},{s:"T",i:2}], targets: ["B2","L0"], colors: ["sarı","yeşil"],
      hint: "Işınlar birbirinin içinden geçebilir." },
    { grid: [".#//",".a..",".\\a\\","#.\\\\"], lanterns: [{s:"T",i:3},{s:"B",i:2}], targets: ["B1","R2"], colors: ["pembe","mavi"] },
    { grid: [".\\.b","..#.","//./",".\\/."], lanterns: [{s:"T",i:0},{s:"T",i:1}], targets: ["B2","R2"], colors: ["yeşil","mor"] },
    { grid: [".#//",".../","\\./.","../b"], lanterns: [{s:"B",i:0},{s:"T",i:3},{s:"L",i:1}], targets: ["B3","R0","R2"], colors: ["kırmızı","mavi","sarı"],
      hint: "Üç fener! Tüm ışıklar aynı anda hedefe ulaşmalı." },
    { grid: ["a.\\.","\\./\\",".//.","#/.."], lanterns: [{s:"T",i:3},{s:"R",i:3},{s:"T",i:2}], targets: ["R2","B2","L1"], colors: ["yeşil","pembe","mavi"] },
    { grid: ["\\\\/a","/../","..b#","/./."], lanterns: [{s:"R",i:0},{s:"T",i:3},{s:"L",i:1}], targets: ["B1","T2","B2"], colors: ["sarı","mor","kırmızı"] },
    { grid: ["b\\\\.","\\.\\\\","/../","\\#.."], lanterns: [{s:"T",i:1},{s:"B",i:2},{s:"L",i:2},{s:"L",i:1}], targets: ["T0","L3","R0","L0"], colors: ["mavi","kırmızı","yeşil","sarı"],
      hint: "Dört fener! Bir aynayı çevirmek birden fazla ışığı etkileyebilir." },
    { grid: ["b#b\\","\\/..","\\//.","..\\\\"], lanterns: [{s:"B",i:1},{s:"B",i:2},{s:"R",i:1},{s:"L",i:2}], targets: ["B0","T2","L3","L1"], colors: ["mor","sarı","mavi","pembe"] },
    { grid: ["\\aa/","\\.\\.","//#/","/..\\"], lanterns: [{s:"T",i:3},{s:"B",i:0},{s:"L",i:1},{s:"R",i:2}], targets: ["B1","B3","T1","R0"], colors: ["kırmızı","yeşil","mavi","sarı"],
      hint: "Son bölüm. Bol şans!" },
  ];
  const DIR = { L: [1,0], R: [-1,0], T: [0,1], B: [0,-1] };
  const ROT = { L: 0, T: 90, R: 180, B: 270 };

  const $ = id => document.getElementById(id);
  const board = $('board'), svg = $('beams');
  let lvl = 0, grid, angles, moves, lightOn = false, solvedLvl = false, optimal = 0, timers = [];
  let progress = {}, soundOn = true;
  try { progress = JSON.parse(localStorage.getItem('fener-progress') || '{}'); soundOn = localStorage.getItem('fener-sound') !== '0'; } catch (e) {}
  const save = () => { try { localStorage.setItem('fener-progress', JSON.stringify(progress)); localStorage.setItem('fener-sound', soundOn ? '1' : '0'); } catch (e) {} };
  const col = (L, i) => PALETTE[L.colors[i]];

  /* ---------- sound (Web Audio, starts after first tap) ---------- */
  let ac = null;
  function tone(freq, dur = .12, type = 'sine', vol = .08, delay = 0) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  const sfx = {
    rotate: () => tone(520, .08, 'triangle', .06),
    locked: () => tone(140, .12, 'square', .04),
    on: () => { tone(300, .15, 'sine', .07); tone(600, .25, 'sine', .05, .05); },
    off: () => tone(220, .12, 'sine', .05),
    hit: i => tone(660 + i * 130, .35, 'sine', .06),
    win: () => [523, 659, 784, 1046].forEach((f, k) => tone(f, .4, 'triangle', .07, k * .11)),
  };
  const soundIcon = () => $('soundBtn').innerHTML = soundOn
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';

  /* ---------- logic ---------- */
  const sidePos = (s, i) => s === 'L' ? [-1, i] : s === 'R' ? [N, i] : s === 'T' ? [i, -1] : [i, N];
  const keyOf = (x, y) => x < 0 ? 'L' + y : x >= N ? 'R' + y : y < 0 ? 'T' + x : 'B' + x;
  const center = (x, y) => [(x + 1) * 100 + 50, (y + 1) * 100 + 50];
  const isSlash = c => c === '/' || c === 'a';
  const isBack = c => c === '\\' || c === 'b';

  function trace(g, l) {
    let [x, y] = sidePos(l.s, l.i), [dx, dy] = DIR[l.s];
    const [sx, sy] = center(x, y);
    const pts = [[sx + dx * 30, sy + dy * 30]], hits = [];
    for (let k = 0; k < 80; k++) {
      x += dx; y += dy;
      if (x < 0 || y < 0 || x >= N || y >= N) { pts.push(center(x, y)); return { pts, hits, end: keyOf(x, y) }; }
      const c = g[y][x];
      if (c === '#') { const [cx, cy] = center(x, y); pts.push([cx - dx * 46, cy - dy * 46]); hits.push([x, y]); return { pts, hits, end: null }; }
      if (isSlash(c)) { [dx, dy] = [-dy, -dx]; pts.push(center(x, y)); hits.push([x, y]); }
      else if (isBack(c)) { [dx, dy] = [dy, dx]; pts.push(center(x, y)); hits.push([x, y]); }
    }
    return { pts, hits, end: null };
  }
  const isSolved = (g, L) => L.lanterns.every((l, i) => trace(g, l).end === L.targets[i]);

  function computeOptimal(L) {
    const rot = [];
    L.grid.forEach((row, y) => [...row].forEach((c, x) => { if (c === '/' || c === '\\') rot.push([x, y]); }));
    let best = Infinity;
    for (let m = 0; m < 1 << rot.length; m++) {
      const g = L.grid.map(r => [...r]); let d = 0;
      rot.forEach(([x, y], j) => { const want = (m >> j & 1) ? '/' : '\\'; if (g[y][x] !== want) d++; g[y][x] = want; });
      if (d < best && isSolved(g, L)) best = d;
    }
    return best;
  }

  /* ---------- drawing pieces ---------- */
  const lanternSVG = (c, id) => `
    <svg viewBox="-50 -50 100 100">
      <defs>
        <radialGradient id="h${id}"><stop offset="0" stop-color="${c}" stop-opacity=".9"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>
        <linearGradient id="b${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d08a"/><stop offset=".5" stop-color="#c99a4b"/><stop offset="1" stop-color="#6e4f1f"/></linearGradient>
      </defs>
      <ellipse class="halo" cx="30" cy="0" rx="34" ry="40" fill="url(#h${id})"/>
      <rect x="-38" y="-14" width="12" height="28" rx="3" fill="url(#b${id})"/>
      <path d="M-28 -24 H10 L28 -32 V32 L10 24 H-28 Z" fill="#22284a" stroke="url(#b${id})" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-20 -14 H6 V14 H-20 Z" fill="${c}" opacity=".25"/>
      <path d="M-16 -9 H2 M-16 0 H2 M-16 9 H2" stroke="${c}" stroke-opacity=".5" stroke-width="2"/>
      <ellipse class="lens" cx="27" cy="0" rx="6" ry="29" fill="${c}"/>
      <ellipse cx="25" cy="-12" rx="2" ry="8" fill="#fff" opacity=".6"/>
    </svg>`;
  const targetSVG = c => `
    <svg viewBox="-50 -50 100 100">
      <circle r="40" fill="#0b1029" stroke="#6e4f1f" stroke-width="3"/>
      <g class="ring"><circle r="34" fill="none" stroke="${c}" stroke-width="4" stroke-dasharray="12 8" stroke-linecap="round"/></g>
      <circle r="24" fill="none" stroke="${c}" stroke-opacity=".35" stroke-width="3"/>
      <path class="gem" d="M0 -18 L15 -4 L0 18 L-15 -4 Z" fill="#1e2650" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-15 -4 H15 M0 -18 L-5 -4 L0 18 L5 -4 Z" fill="none" stroke="${c}" stroke-opacity=".5" stroke-width="1.5"/>
    </svg>`;
  const powerSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.6a8 8 0 1 0 11.4 0"/></svg>`;

  function renderLevelButtons() {
    const wrap = $('levels'); wrap.innerHTML = '';
    LEVELS.forEach((_, i) => {
      const b = document.createElement('button');
      b.textContent = i + 1;
      b.setAttribute('aria-label', 'Bölüm ' + (i + 1));
      if (progress[i]) { b.classList.add('done'); b.dataset.stars = '★'.repeat(progress[i]); }
      if (i === lvl) b.classList.add('cur');
      b.disabled = i > 0 && !progress[i - 1] && !progress[i];
      b.onclick = () => load(i);
      wrap.appendChild(b);
    });
    $('prevBtn').disabled = lvl === 0;
    $('nextBtn').disabled = lvl === LEVELS.length - 1 || !progress[lvl];
  }

  function load(i) {
    timers.forEach(clearTimeout); timers = [];
    lvl = i; const L = LEVELS[i];
    grid = L.grid.map(r => [...r]);
    angles = grid.map(r => r.map(c => isSlash(c) ? -45 : 45));
    moves = 0; lightOn = false; solvedLvl = false;
    optimal = computeOptimal(L);
    $('levelTitle').textContent = `Bölüm ${i + 1} / ${LEVELS.length}`;
    $('levelLights').innerHTML = L.colors.map(c => `<i style="color:${PALETTE[c]}" title="${c}"></i>`).join('');
    const cap = w => w.charAt(0).toLocaleUpperCase('tr') + w.slice(1);
    $('hint').innerHTML = L.hint || (L.colors.length > 1
      ? 'Her feneri kendi rengindeki hedefe yönlendir.'
      : `<b style="color:${PALETTE[L.colors[0]]}">${cap(L.colors[0])}</b> ışığı hedefe ulaştır.`);
    tintSky(L.colors.map(c => PALETTE[c]));
    build(); renderLevelButtons(); updateMoves(); drawBeams(false);
  }

  function build() {
    const L = LEVELS[lvl];
    [...board.querySelectorAll('.cell')].forEach(n => n.remove());
    const lanternAt = {}, targetAt = {};
    L.lanterns.forEach((l, i) => lanternAt[l.s + l.i] = i);
    L.targets.forEach((t, i) => targetAt[t] = i);
    for (let gy = -1; gy <= N; gy++) for (let gx = -1; gx <= N; gx++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.gridColumn = gx + 2; cell.style.gridRow = gy + 2;
      const inside = gx >= 0 && gy >= 0 && gx < N && gy < N;
      const corner = (gx < 0 || gx >= N) && (gy < 0 || gy >= N);
      if (inside) {
        const c = grid[gy][gx];
        const t = document.createElement('div'); t.className = 'tile'; t.dataset.x = gx; t.dataset.y = gy;
        if (c === '#') t.classList.add('wall');
        else if (c !== '.') {
          const m = document.createElement('div'); m.className = 'mirror';
          m.style.setProperty('--a', angles[gy][gx] + 'deg');
          t.appendChild(m);
          t.classList.add(c === 'a' || c === 'b' ? 'locked' : 'rot');
          t.onclick = () => rotate(gx, gy, t);
        }
        cell.appendChild(t);
      } else if (corner) {
        if (gx === N && gy === N) {
          cell.classList.add('out');
          const b = document.createElement('button'); b.id = 'power'; b.innerHTML = powerSVG;
          b.setAttribute('aria-label', 'Fenerleri aç/kapat');
          b.onclick = togglePower;
          cell.appendChild(b);
        }
      } else {
        const k = keyOf(gx, gy);
        if (k in lanternAt) {
          const i = lanternAt[k], l = L.lanterns[i];
          const d = document.createElement('div'); d.className = 'lantern'; d.dataset.i = i;
          d.style.setProperty('--r', ROT[l.s] + 'deg'); d.innerHTML = lanternSVG(col(L, i), lvl + '_' + i);
          cell.appendChild(d);
        } else if (k in targetAt) {
          const i = targetAt[k];
          const d = document.createElement('div'); d.className = 'target'; d.dataset.i = i;
          d.style.setProperty('--col', col(L, i)); d.innerHTML = targetSVG(col(L, i));
          cell.appendChild(d);
        }
      }
      board.appendChild(cell);
    }
    $('power').classList.toggle('nudge', lvl === 0 && !progress[0]);
  }

  function rotate(x, y, el) {
    if (solvedLvl) return;
    const c = grid[y][x];
    if (c === 'a' || c === 'b') { sfx.locked(); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return; }
    grid[y][x] = c === '/' ? '\\' : '/';
    angles[y][x] += 90;
    el.querySelector('.mirror').style.setProperty('--a', angles[y][x] + 'deg');
    moves++; updateMoves(); sfx.rotate();
    if (lightOn) drawBeams(false);
  }

  function togglePower() {
    if (solvedLvl) return;
    lightOn = !lightOn;
    $('power').classList.remove('nudge');
    lightOn ? sfx.on() : sfx.off();
    drawBeams(lightOn);
  }

  function updateMoves() { $('moves').textContent = 'Hamle ' + moves; }

  function drawBeams(animate) {
    const L = LEVELS[lvl];
    timers.forEach(clearTimeout); timers = [];
    [...svg.querySelectorAll('g.beam')].forEach(n => n.remove());
    board.querySelectorAll('.tile.lit').forEach(t => t.classList.remove('lit'));
    board.querySelectorAll('.target').forEach(t => t.classList.remove('hit'));
    board.querySelectorAll('.lantern').forEach(t => t.classList.toggle('on', lightOn));
    $('power').classList.toggle('on', lightOn);
    if (!lightOn) return;

    let allHit = true, maxDur = 0;
    L.lanterns.forEach((l, i) => {
      const r = trace(grid, l), c = col(L, i);
      const d = 'M' + r.pts.map(p => p.join(' ')).join(' L');
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'beam');
      g.style.mixBlendMode = 'screen';
      const mk = (w, color, op, filt) => {
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', color);
        p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
        p.setAttribute('opacity', op); if (filt) p.setAttribute('filter', 'url(#glow)');
        g.appendChild(p); return p;
      };
      const paths = [mk(26, c, .55, true), mk(9, c, .95), mk(3, '#ffffff', .85)];
      svg.appendChild(g);
      const hit = r.end === L.targets[i];
      if (!hit) allHit = false;
      const len = paths[1].getTotalLength();
      const dur = animate ? Math.max(350, len * 1.1) : 0;
      maxDur = Math.max(maxDur, dur);
      if (animate) paths.forEach(p => {
        p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
        p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, easing: 'linear', fill: 'forwards' });
      });
      let acc = 0;
      for (let k = 1; k < r.pts.length; k++) {
        const [ax, ay] = r.pts[k - 1], [bx, by] = r.pts[k];
        acc += Math.hypot(bx - ax, by - ay);
        const h = r.hits[k - 1];
        if (!h) continue;
        const t = board.querySelector(`.tile[data-x="${h[0]}"][data-y="${h[1]}"]`);
        timers.push(setTimeout(() => { if (lightOn && t) { t.style.setProperty('--glow', c); t.classList.add('lit'); } }, animate ? acc / len * dur : 0));
      }
      if (hit) timers.push(setTimeout(() => {
        if (!lightOn) return;
        const tg = board.querySelector(`.target[data-i="${i}"]`); if (tg) tg.classList.add('hit');
        if (animate) sfx.hit(i);
      }, dur));
      else addSpark(g, r.pts[r.pts.length - 1], c, dur);
    });

    if (allHit) { solvedLvl = true; timers.push(setTimeout(win, maxDur + 600)); }
  }

  function addSpark(g, [x, y], c, delay) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    s.setAttribute('cx', x); s.setAttribute('cy', y); s.setAttribute('r', 12); s.setAttribute('fill', c);
    s.setAttribute('filter', 'url(#glow)'); s.style.opacity = 0;
    g.appendChild(s);
    s.animate([{ opacity: 0 }, { opacity: 1 }, { opacity: .35 }], { duration: 800, delay, iterations: Infinity, direction: 'alternate' });
  }

  function win() {
    const L = LEVELS[lvl];
    const stars = moves <= optimal ? 3 : moves <= optimal + 2 ? 2 : 1;
    progress[lvl] = Math.max(progress[lvl] || 0, stars); save();
    $('stars').innerHTML = [1, 2, 3].map(s => `<span class="${s <= stars ? 'on' : 'off'}">★</span>`).join('');
    const last = lvl === LEVELS.length - 1;
    $('winTitle').textContent = L.colors.length > 1 ? 'Işıklar hedefte!' : 'Işık hedefte!';
    $('winText').textContent = `${moves} hamlede çözdün (en az: ${optimal}).` + (last ? ' Tüm bölümleri bitirdin!' : '');
    $('winNext').textContent = last ? 'Baştan oyna' : 'Sonraki bölüm';
    $('win').classList.add('show');
    sfx.win();
    burst(L.colors.map(c => PALETTE[c]));
    renderLevelButtons();
    $('winNext').focus();
  }

  $('winNext').onclick = () => { $('win').classList.remove('show'); load(lvl === LEVELS.length - 1 ? 0 : lvl + 1); };
  $('resetBtn').onclick = () => load(lvl);
  $('prevBtn').onclick = () => lvl > 0 && load(lvl - 1);
  $('nextBtn').onclick = () => lvl < LEVELS.length - 1 && progress[lvl] && load(lvl + 1);
  $('soundBtn').onclick = () => { soundOn = !soundOn; save(); soundIcon(); };
  soundIcon();

  /* ---------- night sky: stars + coloured glow tinted by the level's lights ---------- */
  const sky = $('sky'), sc = sky.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [], tint = ['#4cc9ff'], W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    [sky, fx].forEach(cv => { cv.width = W * dpr; cv.height = H * dpr; });
    stars = Array.from({ length: Math.round(W * H / 3500) }, () => ({
      x: Math.random() * W, y: Math.random() * H * .8, r: Math.random() * 1.3 + .3,
      p: Math.random() * Math.PI * 2, s: .5 + Math.random() * 1.5,
    }));
  }
  function tintSky(cols) { tint = cols; }
  function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
  function drawSky(t) {
    sc.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = sc.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#050816'); g.addColorStop(.55, '#0c1435'); g.addColorStop(1, '#1a2457');
    sc.fillStyle = g; sc.fillRect(0, 0, W, H);
    // soft aurora blobs in the level's colours
    tint.forEach((c, i) => {
      const a = t / 9000 + i * 2.1;
      const x = W * (.5 + .38 * Math.cos(a)), y = H * (.32 + .12 * Math.sin(a * 1.3));
      const rad = Math.max(W, H) * .45;
      const rg = sc.createRadialGradient(x, y, 0, x, y, rad);
      rg.addColorStop(0, hexA(c, .16)); rg.addColorStop(1, hexA(c, 0));
      sc.fillStyle = rg; sc.fillRect(0, 0, W, H);
    });
    for (const s of stars) {
      const tw = reduce ? .8 : .55 + .45 * Math.sin(t / 1000 * s.s + s.p);
      sc.globalAlpha = tw; sc.fillStyle = '#fff';
      sc.beginPath(); sc.arc(s.x, s.y, s.r, 0, Math.PI * 2); sc.fill();
    }
    sc.globalAlpha = 1;
  }

  /* ---------- win confetti of light ---------- */
  const fx = $('fx'), fc = fx.getContext('2d');
  let parts = [];
  function burst(cols) {
    if (reduce) return;
    const rect = $('board').getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    for (let k = 0; k < 140; k++) {
      const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 7;
      parts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, c: cols[k % cols.length], r: 2 + Math.random() * 3 });
    }
  }
  function drawFx() {
    fc.setTransform(dpr, 0, 0, dpr, 0, 0);
    fc.clearRect(0, 0, W, H);
    if (!parts.length) return;
    fc.globalCompositeOperation = 'lighter';
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .12; p.vx *= .985; p.life -= .012;
      fc.globalAlpha = Math.max(0, p.life);
      fc.fillStyle = p.c; fc.beginPath(); fc.arc(p.x, p.y, p.r, 0, Math.PI * 2); fc.fill();
    }
    fc.globalAlpha = 1; fc.globalCompositeOperation = 'source-over';
  }
  function loop(t) { drawSky(t); drawFx(); requestAnimationFrame(loop); }
  addEventListener('resize', resize);
  resize(); requestAnimationFrame(loop);

  let start = 0;
  while (progress[start] && start < LEVELS.length - 1) start++;
  load(start);
})();
</script>
</body>
</html>
