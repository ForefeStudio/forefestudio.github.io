<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fener ve Aynalar</title>
<meta name="description" content="Aynaları çevir, fenerleri yak, her ışığı kendi rengindeki hedefe ulaştır. 15 bölümlük yansıma bulmacası.">
<meta name="theme-color" content="#0b1230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  /* Layout: flat, cute night theme. Board = 4x4 tiles plus a slimmer outer ring for lanterns, targets and the switch. */
  :root {
    color-scheme: dark;
    --sky-0: #0b1230;
    --sky-1: #1a2458;
    --field: #141c45;
    --tile: #2b3778;
    --tile-locked: #3d3b6e;
    --ink: #f4f6ff;
    --muted: #a9b3e0;
    --sun: #ffd166;
    --face: #1b1f3b;
    --blush: #ff9ab8;
    --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* one unit = one tile; ring is 0.72 of a tile, so the board is 5.44 units wide */
    --u: min(calc((100vw - 28px) / 5.44), calc((100dvh - 170px) / 5.44), 112px);
    --c: var(--u);
    --r: calc(var(--u) * .72);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100dvh; }
  body {
    background: var(--sky-0);
    color: var(--ink);
    font-family: var(--body);
    user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; align-items: center;
    padding-block: 10px 24px;
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
  .moon { position: fixed; z-index: -1; top: 6vh; right: 7vw; width: 64px; height: 64px; border-radius: 50%; background: #ffe9a8; box-shadow: 0 0 0 10px rgba(255,233,168,.08), 0 0 0 22px rgba(255,233,168,.04); }
  .moon::before { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #f4d98a; left: 16px; top: 30px; }
  .moon::after { content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #f4d98a; left: 38px; top: 16px; }
  @media (max-width: 700px) { .moon { display: none; } }

  /* ---------- top bar ---------- */
  .wrap { width: calc(var(--c) * 4 + var(--r) * 2); max-width: 100%; }
  header { display: flex; align-items: center; gap: 8px; }
  h1 { flex: 1; margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(20px, 6vw, 26px); line-height: 1; color: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn {
    width: 40px; height: 40px; border-radius: 14px; border: none; cursor: pointer; flex: none;
    background: rgba(255,255,255,.09); color: var(--ink); display: grid; place-items: center;
  }
  .iconbtn svg { width: 20px; height: 20px; }
  .iconbtn:active { transform: scale(.92); }

  .bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .step { width: 34px; height: 34px; border-radius: 12px; border: none; background: rgba(255,255,255,.09); color: var(--ink); font-size: 20px; font-weight: 800; cursor: pointer; display: grid; place-items: center; padding: 0; line-height: 1; }
  .step:disabled { opacity: .3; cursor: default; }
  #levelTitle { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #levelLights { display: flex; gap: 4px; flex: 1; }
  #levelLights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: currentColor; }
  #moves { font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1; padding: 9px 12px 7px; border-radius: 999px; background: rgba(255,255,255,.09); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #hint { font-size: 14px; font-weight: 700; color: var(--muted); margin: 10px 0 8px; text-align: center; min-height: 19px; text-wrap: balance; }
  #hint b { color: var(--ink); }

  /* ---------- board ---------- */
  #board {
    position: relative; margin: auto; flex: none;
    width: calc(var(--c) * 4 + var(--r) * 2); height: calc(var(--c) * 4 + var(--r) * 2);
    display: grid;
    grid-template-columns: var(--r) repeat(4, var(--c)) var(--r);
    grid-template-rows: var(--r) repeat(4, var(--c)) var(--r);
  }
  #board::before {
    content: ""; position: absolute; border-radius: 22px; background: var(--field);
    left: calc(var(--r) - 6px); top: calc(var(--r) - 6px);
    width: calc(var(--c) * 4 + 12px); height: calc(var(--c) * 4 + 12px);
  }
  .cell { position: relative; display: grid; place-items: center; z-index: 1; }
  .cell.out { z-index: 4; }
  .tile {
    width: calc(100% - 8px); height: calc(100% - 8px); border-radius: 16px; position: relative; overflow: hidden;
    background: var(--tile); transition: background .25s;
  }
  .tile.rot { cursor: pointer; }
  .tile.rot::before {  /* little rotate arrow */
    content: ""; position: absolute; right: 7px; top: 7px; width: 10px; height: 10px;
    border: 2.5px solid rgba(255,255,255,.28); border-left-color: transparent; border-bottom-color: transparent; border-radius: 50%;
  }
  @media (hover: hover) { .tile.rot:hover { background: #34418b; } }
  .tile.rot:active { transform: scale(.94); }
  .mirror {
    position: absolute; left: 50%; top: 50%; width: 104%; height: 15%; border-radius: 99px;
    background: #e9f7ff;
    transform: translate(-50%, -50%) rotate(var(--a));
    transition: transform .32s cubic-bezier(.3,1.7,.5,1);
  }
  .mirror::after { content: ""; position: absolute; left: 22%; right: 22%; top: 28%; height: 22%; border-radius: 99px; background: #ffffff; opacity: .9; }
  .mirror::before { content: ""; position: absolute; inset: 0; border-radius: 99px; background: #a9cbe3; clip-path: inset(55% 0 0 0); }
  .tile.lit { background: color-mix(in srgb, var(--glow) 28%, var(--tile)); }
  .tile.locked { background: var(--tile-locked); }
  .tile.locked .lock { position: absolute; right: 6px; top: 5px; width: 16px; height: 16px; opacity: .8; }
  .tile.locked .mirror { background: #d9d6f2; }
  .tile.locked.lit { background: color-mix(in srgb, var(--glow) 28%, var(--tile-locked)); }
  .tile.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px) rotate(-3deg); } 75% { transform: translateX(4px) rotate(3deg); } }
  .tile.wall { background: #8a5f45; }
  .tile.wall svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .lantern, .target { width: 92%; height: 92%; position: relative; }
  .lantern svg, .target svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .lantern .body { transition: opacity .3s; opacity: .7; }
  .lantern.on .body { opacity: 1; }
  .lantern .awake, .target .happy { display: none; }
  .lantern.on .awake, .target.hit .happy { display: inline; }
  .lantern.on .asleep, .target.hit .sleepy { display: none; }
  .lantern.on { animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2px) scale(1.03); } }
  .target .disc { transition: fill .3s; }
  .target.hit .disc { fill: var(--col); }
  .target.hit { animation: hop .7s ease-in-out infinite; }
  @keyframes hop { 50% { transform: translateY(-3px) scale(1.06); } }

  #power {
    width: 96%; height: 96%; border-radius: 50%; border: none; cursor: pointer; padding: 0; position: relative;
    background: #ff5d73; color: #fff; display: grid; place-items: center;
    box-shadow: 0 5px 0 #c23452; transition: transform .08s, box-shadow .08s, background .25s;
  }
  #power svg { width: 50%; height: 50%; }
  #power:active { transform: translateY(4px); box-shadow: 0 1px 0 #c23452; }
  #power.on { background: #39d98a; box-shadow: 0 5px 0 #1f9e5f; }
  #power.on:active { box-shadow: 0 1px 0 #1f9e5f; }
  #power.nudge { animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.1); } }

  #beams { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }

  /* ---------- dialogs ---------- */
  .overlay { position: fixed; inset: 0; display: none; place-items: center; z-index: 10; background: rgba(6, 9, 26, .6); padding: 16px; }
  .overlay.show { display: grid; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } }
  .card {
    background: var(--sky-1); border-radius: 26px; padding: 24px 22px 22px; text-align: center; width: min(340px, 100%);
    animation: pop .4s cubic-bezier(.3,1.6,.5,1);
  }
  @keyframes pop { from { transform: scale(.8); } }
  .card h2 { font-family: var(--display); margin: 0 0 4px; font-size: 28px; line-height: 1.1; color: var(--sun); }
  .card p { margin: 0 0 14px; color: var(--muted); font-size: 15px; font-weight: 700; }
  .stars { font-size: 42px; letter-spacing: 8px; margin-bottom: 16px; line-height: 1; }
  .stars span { display: inline-block; animation: starIn .45s cubic-bezier(.3,1.8,.5,1) backwards; }
  .stars span:nth-child(2) { animation-delay: .15s; } .stars span:nth-child(3) { animation-delay: .3s; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); } }
  .stars .off { color: #3a4580; }
  .stars .on { color: var(--sun); }
  .btn { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1; border: none; border-radius: 16px; padding: 13px 22px 11px; cursor: pointer; background: var(--sun); color: #3a2500; box-shadow: 0 4px 0 #d49a1e; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d49a1e; }
  #levelGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 6px 0 16px; }
  #levelGrid button {
    aspect-ratio: 1; border-radius: 14px; border: none; cursor: pointer; padding: 0;
    background: rgba(255,255,255,.09); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1;
  }
  #levelGrid button small { font-size: 10px; color: var(--sun); letter-spacing: -1px; min-height: 10px; }
  #levelGrid button.cur { background: var(--sun); color: #3a2500; }
  #levelGrid button.cur small { color: #3a2500; }
  #levelGrid button:disabled { opacity: .3; cursor: default; }
  .ghost { background: none; border: none; color: var(--muted); font-weight: 800; font-size: 15px; cursor: pointer; padding: 6px 10px; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="moon"></div>
<canvas id="fx"></canvas>

<div class="wrap">
  <header>
    <h1>Fener &amp; Aynalar</h1>
    <button class="iconbtn" id="levelsBtn" title="Bölümler" aria-label="Bölümler"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></svg></button>
    <button class="iconbtn" id="soundBtn" title="Ses" aria-label="Sesi aç/kapat"></button>
    <button class="iconbtn" id="resetBtn" title="Bölümü sıfırla" aria-label="Bölümü sıfırla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  </header>
  <div class="bar">
    <button class="step" id="prevBtn" aria-label="Önceki bölüm">‹</button>
    <span id="levelTitle"></span>
    <button class="step" id="nextBtn" aria-label="Sonraki bölüm">›</button>
    <span id="levelLights"></span>
    <span id="moves">Hamle 0</span>
  </div>
  <p id="hint"></p>
</div>

<div id="board">
  <svg id="beams" viewBox="0 0 544 544" preserveAspectRatio="none">
    <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs>
  </svg>
</div>

<div class="overlay" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="card">
    <h2 id="winTitle">Işık hedefte!</h2>
    <p id="winText"></p>
    <div class="stars" id="stars"></div>
    <button class="btn" id="winNext">Sonraki bölüm</button>
  </div>
</div>

<div class="overlay" id="levelsDlg" role="dialog" aria-modal="true" aria-labelledby="levelsTitle">
  <div class="card">
    <h2 id="levelsTitle">Bölümler</h2>
    <div id="levelGrid"></div>
    <button class="ghost" id="levelsClose">Kapat</button>
  </div>
</div>

<script>
(() => {
  const N = 4, RING = 72, CELL = 100;
  const PALETTE = {
    mavi:   '#4cc9ff',
    kırmızı:'#ff5d73',
    yeşil:  '#4ee89a',
    sarı:   '#ffc93d',
    mor:    '#b58cff',
    pembe:  '#ff7ad9',
  };
  // grid: '.' empty, '/' '\' rotatable mirror, 'a' locked '/', 'b' locked '\', '#' block
  // lanterns: side (L/R/T/B) + index; targets[i] is where lantern i must land; colors[i] its light colour
  const LEVELS = [
    { grid: ["....","....","....","\\.\\."], lanterns: [{s:"T",i:2}], targets: ["B0"], colors: ["mavi"],
      hint: "Aynalara dokunup çevir, sonra köşedeki <b>düğmeye</b> bas." },
    { grid: ["....","\\.\\.",".#..","../."], lanterns: [{s:"B",i:0}], targets: ["R3"], colors: ["sarı"],
      hint: "Tuğla bloklar ışığı keser." },
    { grid: [".a..","....","...\\",".#//"], lanterns: [{s:"T",i:2}], targets: ["R2"], colors: ["yeşil"],
      hint: "Kilitli aynalar çevrilemez." },
    { grid: ["b.#.","../.",".#//",".../"], lanterns: [{s:"R",i:3}], targets: ["R1"], colors: ["kırmızı"] },
    { grid: ["....","#\\\\\\","....","\\./."], lanterns: [{s:"B",i:0},{s:"B",i:3}], targets: ["B1","R1"], colors: ["mavi","kırmızı"],
      hint: "İki fener! Her ışık <b>kendi rengindeki</b> hedefe gitmeli." },
    { grid: ["\\.\\.",".\\./","//..","##b."], lanterns: [{s:"R",i:3}], targets: ["B3"], colors: ["mor"] },
    { grid: ["..\\/","/..\\",".#..","\\/.a"], lanterns: [{s:"B",i:1},{s:"T",i:2}], targets: ["B2","L0"], colors: ["sarı","yeşil"],
      hint: "Işınlar birbirinin içinden geçebilir." },
    { grid: [".#//",".a..",".\\a\\","#.\\\\"], lanterns: [{s:"T",i:3},{s:"B",i:2}], targets: ["B1","R2"], colors: ["pembe","mavi"] },
    { grid: [".\\.b","..#.","//./",".\\/."], lanterns: [{s:"T",i:0},{s:"T",i:1}], targets: ["B2","R2"], colors: ["yeşil","mor"] },
    { grid: [".#//",".../","\\./.","../b"], lanterns: [{s:"B",i:0},{s:"T",i:3},{s:"L",i:1}], targets: ["B3","R0","R2"], colors: ["kırmızı","mavi","sarı"],
      hint: "Üç fener! Tüm ışıklar aynı anda hedefe ulaşmalı." },
    { grid: ["a.\\.","\\./\\",".//.","#/.."], lanterns: [{s:"T",i:3},{s:"R",i:3},{s:"T",i:2}], targets: ["R2","B2","L1"], colors: ["yeşil","pembe","mavi"] },
    { grid: ["\\\\/a","/../","..b#","/./."], lanterns: [{s:"R",i:0},{s:"T",i:3},{s:"L",i:1}], targets: ["B1","T2","B2"], colors: ["sarı","mor","kırmızı"] },
    { grid: ["b\\\\.","\\.\\\\","/../","\\#.."], lanterns: [{s:"T",i:1},{s:"B",i:2},{s:"L",i:2},{s:"L",i:1}], targets: ["T0","L3","R0","L0"], colors: ["mavi","kırmızı","yeşil","sarı"],
      hint: "Dört fener! Bir ayna birden fazla ışığı etkileyebilir." },
    { grid: ["b#b\\","\\/..","\\//.","..\\\\"], lanterns: [{s:"B",i:1},{s:"B",i:2},{s:"R",i:1},{s:"L",i:2}], targets: ["B0","T2","L3","L1"], colors: ["mor","sarı","mavi","pembe"] },
    { grid: ["\\aa/","\\.\\.","//#/","/..\\"], lanterns: [{s:"T",i:3},{s:"B",i:0},{s:"L",i:1},{s:"R",i:2}], targets: ["B1","B3","T1","R0"], colors: ["kırmızı","yeşil","mavi","sarı"],
      hint: "Son bölüm. Bol şans!" },
  ];
  const DIR = { L: [1,0], R: [-1,0], T: [0,1], B: [0,-1] };
  const ROT = { L: 0, T: 90, R: 180, B: 270 };

  const $ = id => document.getElementById(id);
  const board = $('board'), svg = $('beams');
  let lvl = 0, grid, angles, moves, lightOn = false, solvedLvl = false, optimal = 0, timers = [];
  let progress = {}, soundOn = true;
  try { progress = JSON.parse(localStorage.getItem('fener-progress') || '{}'); soundOn = localStorage.getItem('fener-sound') !== '0'; } catch (e) {}
  const save = () => { try { localStorage.setItem('fener-progress', JSON.stringify(progress)); localStorage.setItem('fener-sound', soundOn ? '1' : '0'); } catch (e) {} };
  const col = (L, i) => PALETTE[L.colors[i]];
  const unlocked = i => i === 0 || !!progress[i - 1] || !!progress[i];

  /* ---------- sound ---------- */
  let ac = null;
  function tone(freq, dur = .12, type = 'sine', vol = .08, delay = 0) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  const sfx = {
    rotate: () => tone(560, .08, 'triangle', .06),
    locked: () => tone(150, .12, 'square', .035),
    on: () => { tone(330, .15, 'sine', .07); tone(660, .25, 'sine', .05, .05); },
    off: () => tone(240, .12, 'sine', .05),
    hit: i => tone(660 + i * 130, .35, 'sine', .06),
    win: () => [523, 659, 784, 1046].forEach((f, k) => tone(f, .4, 'triangle', .07, k * .11)),
  };
  const soundIcon = () => $('soundBtn').innerHTML = soundOn
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';

  /* ---------- logic ---------- */
  const sidePos = (s, i) => s === 'L' ? [-1, i] : s === 'R' ? [N, i] : s === 'T' ? [i, -1] : [i, N];
  const keyOf = (x, y) => x < 0 ? 'L' + y : x >= N ? 'R' + y : y < 0 ? 'T' + x : 'B' + x;
  const coord = v => v < 0 ? RING / 2 : v >= N ? RING + N * CELL + RING / 2 : RING + v * CELL + CELL / 2;
  const center = (x, y) => [coord(x), coord(y)];
  const isSlash = c => c === '/' || c === 'a';
  const isBack = c => c === '\\' || c === 'b';

  function trace(g, l) {
    let [x, y] = sidePos(l.s, l.i), [dx, dy] = DIR[l.s];
    const [sx, sy] = center(x, y);
    const pts = [[sx + dx * 26, sy + dy * 26]], hits = [];
    for (let k = 0; k < 80; k++) {
      x += dx; y += dy;
      if (x < 0 || y < 0 || x >= N || y >= N) { pts.push(center(x, y)); return { pts, hits, end: keyOf(x, y) }; }
      const c = g[y][x];
      if (c === '#') { const [cx, cy] = center(x, y); pts.push([cx - dx * 44, cy - dy * 44]); hits.push([x, y]); return { pts, hits, end: null }; }
      if (isSlash(c)) { [dx, dy] = [-dy, -dx]; pts.push(center(x, y)); hits.push([x, y]); }
      else if (isBack(c)) { [dx, dy] = [dy, dx]; pts.push(center(x, y)); hits.push([x, y]); }
    }
    return { pts, hits, end: null };
  }
  const isSolved = (g, L) => L.lanterns.every((l, i) => trace(g, l).end === L.targets[i]);

  function computeOptimal(L) {
    const rot = [];
    L.grid.forEach((row, y) => [...row].forEach((c, x) => { if (c === '/' || c === '\\') rot.push([x, y]); }));
    let best = Infinity;
    for (let m = 0; m < 1 << rot.length; m++) {
      const g = L.grid.map(r => [...r]); let d = 0;
      rot.forEach(([x, y], j) => { const want = (m >> j & 1) ? '/' : '\\'; if (g[y][x] !== want) d++; g[y][x] = want; });
      if (d < best && isSolved(g, L)) best = d;
    }
    return best;
  }

  /* ---------- cute pieces ---------- */
  // lantern: upright body with a face; the little nozzle turns toward the board
  const lanternSVG = (c, rot) => `
    <svg viewBox="-50 -50 100 100">
      <g transform="rotate(${rot})"><path d="M22 -15 L44 -24 Q48 0 44 24 L22 15 Z" fill="${c}"/></g>
      <g class="body">
        <path d="M-12 -38 Q0 -50 12 -38" fill="none" stroke="#ffe9a8" stroke-width="5" stroke-linecap="round"/>
        <rect x="-18" y="-38" width="36" height="8" rx="4" fill="#ffe9a8"/>
        <rect x="-28" y="-32" width="56" height="58" rx="20" fill="${c}"/>
        <rect x="-20" y="-25" width="10" height="16" rx="5" fill="#fff" opacity=".35"/>
        <rect x="-18" y="24" width="36" height="9" rx="4.5" fill="#ffe9a8"/>
        <g class="asleep" stroke="${'#1b1f3b'}" stroke-width="3.5" stroke-linecap="round" fill="none">
          <path d="M-14 -2 q5 4 10 0"/><path d="M4 -2 q5 4 10 0"/>
        </g>
        <g class="awake" fill="#1b1f3b">
          <ellipse cx="-9" cy="-3" rx="4" ry="5.5"/><ellipse cx="9" cy="-3" rx="4" ry="5.5"/>
          <circle cx="-7.5" cy="-5" r="1.6" fill="#fff"/><circle cx="10.5" cy="-5" r="1.6" fill="#fff"/>
        </g>
        <circle cx="-17" cy="8" r="4.5" fill="#ff9ab8" opacity=".8"/><circle cx="17" cy="8" r="4.5" fill="#ff9ab8" opacity=".8"/>
        <path d="M-5 9 q5 5 10 0" stroke="#1b1f3b" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
    </svg>`;
  // target: a little round friend that sleeps until its light arrives
  const targetSVG = c => `
    <svg viewBox="-50 -50 100 100">
      <circle r="40" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round"/>
      <circle class="disc" r="30" fill="#2b3778"/>
      <g class="sleepy" stroke="#a9b3e0" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M-15 -2 h9"/><path d="M6 -2 h9"/><path d="M-4 11 h8"/>
      </g>
      <g class="happy" stroke="#1b1f3b" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M-16 0 q5.5 -8 11 0"/><path d="M5 0 q5.5 -8 11 0"/>
        <path d="M-8 9 q8 9 16 0" fill="#1b1f3b"/>
      </g>
      <g class="happy"><circle cx="-19" cy="10" r="4" fill="#ff9ab8"/><circle cx="19" cy="10" r="4" fill="#ff9ab8"/></g>
    </svg>`;
  const lockSVG = `<svg class="lock" viewBox="0 0 16 16"><path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2" fill="none" stroke="#fff" stroke-width="2"/><rect x="2.5" y="7" width="11" height="8" rx="2.5" fill="#fff"/></svg>`;
  const wallSVG = `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><g fill="#a8775a"><rect x="6" y="8" width="40" height="22" rx="6"/><rect x="54" y="8" width="40" height="22" rx="6"/><rect x="-14" y="39" width="40" height="22" rx="6"/><rect x="31" y="39" width="38" height="22" rx="6"/><rect x="74" y="39" width="40" height="22" rx="6"/><rect x="6" y="70" width="40" height="22" rx="6"/><rect x="54" y="70" width="40" height="22" rx="6"/></g></svg>`;
  const powerSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.6a8 8 0 1 0 11.4 0"/></svg>`;

  function renderNav() {
    $('prevBtn').disabled = lvl === 0;
    $('nextBtn').disabled = lvl === LEVELS.length - 1 || !unlocked(lvl + 1);
  }
  function renderLevelGrid() {
    const wrap = $('levelGrid'); wrap.innerHTML = '';
    LEVELS.forEach((L, i) => {
      const b = document.createElement('button');
      b.innerHTML = `${i + 1}<small>${'★'.repeat(progress[i] || 0)}</small>`;
      b.setAttribute('aria-label', 'Bölüm ' + (i + 1));
      if (i === lvl) b.classList.add('cur');
      b.disabled = !unlocked(i);
      b.onclick = () => { $('levelsDlg').classList.remove('show'); load(i); };
      wrap.appendChild(b);
    });
  }

  function load(i) {
    timers.forEach(clearTimeout); timers = [];
    lvl = i; const L = LEVELS[i];
    grid = L.grid.map(r => [...r]);
    angles = grid.map(r => r.map(c => isSlash(c) ? -45 : 45));
    moves = 0; lightOn = false; solvedLvl = false;
    optimal = computeOptimal(L);
    $('levelTitle').textContent = `Bölüm ${i + 1}`;
    $('levelLights').innerHTML = L.colors.map(c => `<i style="color:${PALETTE[c]}" title="${c}"></i>`).join('');
    const cap = w => w.charAt(0).toLocaleUpperCase('tr') + w.slice(1);
    $('hint').innerHTML = L.hint || (L.colors.length > 1
      ? 'Her feneri kendi rengindeki hedefe yönlendir.'
      : `<b style="color:${PALETTE[L.colors[0]]}">${cap(L.colors[0])}</b> ışığı hedefe ulaştır.`);
    tint = L.colors.map(c => PALETTE[c]);
    build(); renderNav(); updateMoves(); drawBeams(false);
  }

  function build() {
    const L = LEVELS[lvl];
    [...board.querySelectorAll('.cell')].forEach(n => n.remove());
    const lanternAt = {}, targetAt = {};
    L.lanterns.forEach((l, i) => lanternAt[l.s + l.i] = i);
    L.targets.forEach((t, i) => targetAt[t] = i);
    for (let gy = -1; gy <= N; gy++) for (let gx = -1; gx <= N; gx++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.gridColumn = gx + 2; cell.style.gridRow = gy + 2;
      const inside = gx >= 0 && gy >= 0 && gx < N && gy < N;
      const corner = (gx < 0 || gx >= N) && (gy < 0 || gy >= N);
      if (inside) {
        const c = grid[gy][gx];
        const t = document.createElement('div'); t.className = 'tile'; t.dataset.x = gx; t.dataset.y = gy;
        if (c === '#') { t.classList.add('wall'); t.innerHTML = wallSVG; }
        else if (c !== '.') {
          const m = document.createElement('div'); m.className = 'mirror';
          m.style.setProperty('--a', angles[gy][gx] + 'deg');
          t.appendChild(m);
          if (c === 'a' || c === 'b') { t.classList.add('locked'); t.insertAdjacentHTML('beforeend', lockSVG); }
          else t.classList.add('rot');
          t.onclick = () => rotate(gx, gy, t);
        }
        cell.appendChild(t);
      } else if (corner) {
        if (gx === N && gy === N) {
          cell.classList.add('out');
          const b = document.createElement('button'); b.id = 'power'; b.innerHTML = powerSVG;
          b.setAttribute('aria-label', 'Fenerleri aç/kapat');
          b.onclick = togglePower;
          cell.appendChild(b);
        }
      } else {
        const k = keyOf(gx, gy);
        if (k in lanternAt) {
          const i = lanternAt[k], l = L.lanterns[i];
          const d = document.createElement('div'); d.className = 'lantern'; d.dataset.i = i;
          d.innerHTML = lanternSVG(col(L, i), ROT[l.s]);
          cell.appendChild(d);
        } else if (k in targetAt) {
          const i = targetAt[k];
          const d = document.createElement('div'); d.className = 'target'; d.dataset.i = i;
          d.style.setProperty('--col', col(L, i)); d.innerHTML = targetSVG(col(L, i));
          cell.appendChild(d);
        }
      }
      board.appendChild(cell);
    }
    $('power').classList.toggle('nudge', lvl === 0 && !progress[0]);
  }

  function rotate(x, y, el) {
    if (solvedLvl) return;
    const c = grid[y][x];
    if (c === 'a' || c === 'b') { sfx.locked(); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return; }
    grid[y][x] = c === '/' ? '\\' : '/';
    angles[y][x] += 90;
    el.querySelector('.mirror').style.setProperty('--a', angles[y][x] + 'deg');
    moves++; updateMoves(); sfx.rotate();
    if (lightOn) drawBeams(false);
  }

  function togglePower() {
    if (solvedLvl) return;
    lightOn = !lightOn;
    $('power').classList.remove('nudge');
    lightOn ? sfx.on() : sfx.off();
    drawBeams(lightOn);
  }

  function updateMoves() { $('moves').textContent = 'Hamle ' + moves; }

  function drawBeams(animate) {
    const L = LEVELS[lvl];
    timers.forEach(clearTimeout); timers = [];
    [...svg.querySelectorAll('g.beam')].forEach(n => n.remove());
    board.querySelectorAll('.tile.lit').forEach(t => t.classList.remove('lit'));
    board.querySelectorAll('.target').forEach(t => t.classList.remove('hit'));
    board.querySelectorAll('.lantern').forEach(t => t.classList.toggle('on', lightOn));
    $('power').classList.toggle('on', lightOn);
    if (!lightOn) return;

    let allHit = true, maxDur = 0;
    L.lanterns.forEach((l, i) => {
      const r = trace(grid, l), c = col(L, i);
      const d = 'M' + r.pts.map(p => p.join(' ')).join(' L');
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'beam');
      const mk = (w, color, op, filt) => {
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', color);
        p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
        p.setAttribute('opacity', op); if (filt) p.setAttribute('filter', 'url(#glow)');
        g.appendChild(p); return p;
      };
      const paths = [mk(20, c, .5, true), mk(9, c, 1), mk(3, '#ffffff', .8)];
      svg.appendChild(g);
      const hit = r.end === L.targets[i];
      if (!hit) allHit = false;
      const len = paths[1].getTotalLength();
      const dur = animate ? Math.max(350, len * 1.1) : 0;
      maxDur = Math.max(maxDur, dur);
      if (animate) paths.forEach(p => {
        p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
        p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, easing: 'linear', fill: 'forwards' });
      });
      let acc = 0;
      for (let k = 1; k < r.pts.length; k++) {
        const [ax, ay] = r.pts[k - 1], [bx, by] = r.pts[k];
        acc += Math.hypot(bx - ax, by - ay);
        const h = r.hits[k - 1];
        if (!h) continue;
        const t = board.querySelector(`.tile[data-x="${h[0]}"][data-y="${h[1]}"]`);
        timers.push(setTimeout(() => { if (lightOn && t) { t.style.setProperty('--glow', c); t.classList.add('lit'); } }, animate ? acc / len * dur : 0));
      }
      if (hit) timers.push(setTimeout(() => {
        if (!lightOn) return;
        const tg = board.querySelector(`.target[data-i="${i}"]`); if (tg) tg.classList.add('hit');
        if (animate) sfx.hit(i);
      }, dur));
      else addSpark(g, r.pts[r.pts.length - 1], c, dur);
    });

    if (allHit) { solvedLvl = true; timers.push(setTimeout(win, maxDur + 600)); }
  }

  function addSpark(g, [x, y], c, delay) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    s.setAttribute('cx', x); s.setAttribute('cy', y); s.setAttribute('r', 11); s.setAttribute('fill', c);
    s.setAttribute('filter', 'url(#glow)'); s.style.opacity = 0;
    g.appendChild(s);
    s.animate([{ opacity: 0 }, { opacity: 1 }, { opacity: .35 }], { duration: 800, delay, iterations: Infinity, direction: 'alternate' });
  }

  function win() {
    const L = LEVELS[lvl];
    const stars = moves <= optimal ? 3 : moves <= optimal + 2 ? 2 : 1;
    progress[lvl] = Math.max(progress[lvl] || 0, stars); save();
    $('stars').innerHTML = [1, 2, 3].map(s => `<span class="${s <= stars ? 'on' : 'off'}">★</span>`).join('');
    const last = lvl === LEVELS.length - 1;
    $('winTitle').textContent = L.colors.length > 1 ? 'Işıklar hedefte!' : 'Işık hedefte!';
    $('winText').textContent = `${moves} hamlede çözdün (en az: ${optimal}).` + (last ? ' Tüm bölümleri bitirdin!' : '');
    $('winNext').textContent = last ? 'Baştan oyna' : 'Sonraki bölüm';
    $('win').classList.add('show');
    sfx.win();
    burst(L.colors.map(c => PALETTE[c]));
    renderNav();
    $('winNext').focus();
  }

  $('winNext').onclick = () => { $('win').classList.remove('show'); load(lvl === LEVELS.length - 1 ? 0 : lvl + 1); };
  $('resetBtn').onclick = () => load(lvl);
  $('prevBtn').onclick = () => lvl > 0 && load(lvl - 1);
  $('nextBtn').onclick = () => lvl < LEVELS.length - 1 && unlocked(lvl + 1) && load(lvl + 1);
  $('soundBtn').onclick = () => { soundOn = !soundOn; save(); soundIcon(); };
  $('levelsBtn').onclick = () => { renderLevelGrid(); $('levelsDlg').classList.add('show'); };
  $('levelsClose').onclick = () => $('levelsDlg').classList.remove('show');
  $('levelsDlg').onclick = e => { if (e.target === $('levelsDlg')) $('levelsDlg').classList.remove('show'); };
  soundIcon();

  /* ---------- night sky ---------- */
  const sky = $('sky'), sc = sky.getContext('2d');
  const fx = $('fx'), fc = fx.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [], tint = ['#4cc9ff'], W = 0, H = 0, dpr = 1, parts = [];
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    [sky, fx].forEach(cv => { cv.width = W * dpr; cv.height = H * dpr; });
    stars = Array.from({ length: Math.round(W * H / 4500) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + .4,
      p: Math.random() * Math.PI * 2, s: .5 + Math.random() * 1.5,
    }));
  }
  function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
  function drawSky(t) {
    sc.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = sc.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1230'); g.addColorStop(1, '#1d2a66');
    sc.fillStyle = g; sc.fillRect(0, 0, W, H);
    tint.forEach((c, i) => {
      const a = t / 9000 + i * 2.1;
      const x = W * (.5 + .4 * Math.cos(a)), y = H * (.5 + .3 * Math.sin(a * 1.3));
      const rad = Math.max(W, H) * .5;
      const rg = sc.createRadialGradient(x, y, 0, x, y, rad);
      rg.addColorStop(0, hexA(c, .12)); rg.addColorStop(1, hexA(c, 0));
      sc.fillStyle = rg; sc.fillRect(0, 0, W, H);
    });
    sc.fillStyle = '#fff';
    for (const s of stars) {
      sc.globalAlpha = reduce ? .7 : .45 + .45 * Math.sin(t / 1000 * s.s + s.p);
      sc.beginPath(); sc.arc(s.x, s.y, s.r, 0, Math.PI * 2); sc.fill();
    }
    sc.globalAlpha = 1;
  }
  function burst(cols) {
    if (reduce) return;
    const rect = board.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    for (let k = 0; k < 120; k++) {
      const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 7;
      parts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, c: cols[k % cols.length], r: 3 + Math.random() * 4, star: k % 3 === 0 });
    }
  }
  function drawFx() {
    fc.setTransform(dpr, 0, 0, dpr, 0, 0);
    fc.clearRect(0, 0, W, H);
    if (!parts.length) return;
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .14; p.vx *= .985; p.life -= .012;
      fc.globalAlpha = Math.max(0, p.life); fc.fillStyle = p.c;
      fc.beginPath();
      if (p.star) { for (let k = 0; k < 10; k++) { const rr = k % 2 ? p.r * .45 : p.r * 1.3, a = k * Math.PI / 5 - Math.PI / 2; fc.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr); } }
      else fc.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      fc.fill();
    }
    fc.globalAlpha = 1;
  }
  function loop(t) { drawSky(t); drawFx(); requestAnimationFrame(loop); }
  addEventListener('resize', resize);
  resize(); requestAnimationFrame(loop);

  let start = 0;
  while (progress[start] && start < LEVELS.length - 1) start++;
  load(start);
})();
</script>
</body>
</html>
