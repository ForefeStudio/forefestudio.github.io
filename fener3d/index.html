<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fener Küpü</title>
<meta name="description" content="Fener ve Aynalar'ın küp hali: altı yüzlü bir küpte ışık kenarlardan yandaki yüze geçer.">
<meta name="theme-color" content="#0b1230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  /* Layout: same cute night look as the 2D game; a full-height 3D stage under a compact top bar */
  :root {
    color-scheme: dark;
    --sky-0: #0b1230;
    --sky-1: #1a2458;
    --ink: #f4f6ff;
    --muted: #a9b3e0;
    --sun: #ffd166;
    --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, #0b1230, #1d2a66) fixed, var(--sky-0);
    color: var(--ink); font-family: var(--body);
    user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; overflow: hidden;
    padding-block: 10px 0;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .top { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); width: 100%; max-width: 640px; margin: 0 auto; flex: none; }
  header { display: flex; align-items: center; gap: 8px; }
  h1 { flex: 1; margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(20px, 6vw, 26px); line-height: 1; color: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h1 small { font-size: .55em; color: var(--muted); font-weight: 700; margin-left: 4px; }
  .iconbtn { width: 40px; height: 40px; border-radius: 14px; border: none; cursor: pointer; flex: none; background: rgba(255,255,255,.09); color: var(--ink); display: grid; place-items: center; }
  .iconbtn svg { width: 20px; height: 20px; }
  .iconbtn:active { transform: scale(.92); }
  .bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .step { width: 34px; height: 34px; border-radius: 12px; border: none; background: rgba(255,255,255,.09); color: var(--ink); font-size: 20px; font-weight: 800; cursor: pointer; display: grid; place-items: center; padding: 0; line-height: 1; }
  .step:disabled { opacity: .3; cursor: default; }
  #levelTitle { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1; white-space: nowrap; }
  #levelLights { display: flex; gap: 4px; flex: 1; }
  #levelLights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: currentColor; }
  #moves { font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1; padding: 9px 12px 7px; border-radius: 999px; background: rgba(255,255,255,.09); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #hint { font-size: 14px; font-weight: 700; color: var(--muted); margin: 10px 0 0; text-align: center; min-height: 19px; text-wrap: balance; }
  #hint b { color: var(--ink); }

  #stage { position: relative; flex: 1; min-height: 280px; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }

  .dock {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px;
    padding: 0 max(14px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  #power {
    width: 66px; height: 66px; border-radius: 50%; border: none; cursor: pointer; padding: 0; flex: none;
    background: #ff5d73; color: #fff; display: grid; place-items: center;
    box-shadow: 0 5px 0 #c23452; transition: transform .08s, box-shadow .08s, background .25s;
  }
  #power svg { width: 50%; height: 50%; }
  #power:active { transform: translateY(4px); box-shadow: 0 1px 0 #c23452; }
  #power.on { background: #39d98a; box-shadow: 0 5px 0 #1f9e5f; }
  #power.nudge { animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.1); } }
  .findbtn { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); height: 40px; padding: 0 14px; border-radius: 14px; border: none; background: rgba(255,255,255,.1); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 15px; cursor: pointer; z-index: 2; }
  #dragHint { position: absolute; left: 50%; top: 10px; translate: -50% 0; font-size: 13px; font-weight: 800; color: var(--muted); background: rgba(10,15,40,.6); padding: 6px 12px; border-radius: 99px; pointer-events: none; transition: opacity .5s; white-space: nowrap; }

  .overlay { position: fixed; inset: 0; display: none; place-items: center; z-index: 10; background: rgba(6, 9, 26, .6); padding: 16px; }
  .overlay.show { display: grid; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } }
  .card { max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--sky-1); border-radius: 26px; padding: 24px 22px 22px; text-align: center; width: min(340px, 100%); animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.8); } }
  .card h2 { font-family: var(--display); margin: 0 0 4px; font-size: 28px; line-height: 1.1; color: var(--sun); }
  .card p { margin: 0 0 14px; color: var(--muted); font-size: 15px; font-weight: 700; }
  .stars { font-size: 42px; letter-spacing: 8px; margin-bottom: 16px; line-height: 1; }
  .stars span { display: inline-block; animation: starIn .45s cubic-bezier(.3,1.8,.5,1) backwards; }
  .stars span:nth-child(2) { animation-delay: .15s; } .stars span:nth-child(3) { animation-delay: .3s; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); } }
  .stars .off { color: #3a4580; } .stars .on { color: var(--sun); }
  .btn { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1; border: none; border-radius: 16px; padding: 13px 22px 11px; cursor: pointer; background: var(--sun); color: #3a2500; box-shadow: 0 4px 0 #d49a1e; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d49a1e; }
  #levelGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 16px; }
  #levelGrid button { aspect-ratio: 1; border-radius: 14px; border: none; cursor: pointer; padding: 0; background: rgba(255,255,255,.09); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1; }
  #levelGrid button small { font-size: 10px; color: var(--sun); letter-spacing: -1px; min-height: 10px; }
  #levelGrid button.cur { background: var(--sun); color: #3a2500; }
  #levelGrid button.cur small { color: #3a2500; }
  #levelGrid button:disabled { opacity: .3; cursor: default; }
  .ghost { background: none; border: none; color: var(--muted); font-weight: 800; font-size: 15px; cursor: pointer; padding: 6px 10px; }
  #err { display: none; position: absolute; inset: 0; place-items: center; text-align: center; padding: 20px; color: var(--muted); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="top">
  <header>
    <h1>Fener Küpü <small>3B</small></h1>
    <button class="iconbtn" id="levelsBtn" title="Bölümler" aria-label="Bölümler"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></svg></button>
    <button class="iconbtn" id="soundBtn" title="Ses" aria-label="Sesi aç/kapat"></button>
    <button class="iconbtn" id="resetBtn" title="Bölümü sıfırla" aria-label="Bölümü sıfırla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  </header>
  <div class="bar">
    <button class="step" id="prevBtn" aria-label="Önceki bölüm">‹</button>
    <span id="levelTitle"></span>
    <button class="step" id="nextBtn" aria-label="Sonraki bölüm">›</button>
    <span id="levelLights"></span>
    <span id="moves">Hamle 0</span>
  </div>
  <p id="hint"></p>
</div>

<div id="stage">
  <div id="dragHint">Küpü sürükleyerek çevir</div>
  <button id="findBtn" class="findbtn">Feneri göster</button>
  <div id="err">3B görüntü bu cihazda açılamadı.</div>
  <div class="dock">
    <button id="power" aria-label="Fenerleri aç/kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.6a8 8 0 1 0 11.4 0"/></svg></button>
  </div>
</div>

<div class="overlay" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="card">
    <h2 id="winTitle">Işık hedefte!</h2>
    <p id="winText"></p>
    <div class="stars" id="starsOut"></div>
    <button class="btn" id="winNext">Sonraki bölüm</button>
  </div>
</div>
<div class="overlay" id="levelsDlg" role="dialog" aria-modal="true" aria-labelledby="levelsTitle">
  <div class="card">
    <h2 id="levelsTitle">Bölümler</h2>
    <div id="levelGrid"></div>
    <button class="ghost" id="levelsClose">Kapat</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---- surface-cube light engine: six 4x4 faces, light wraps over the cube's edges ----
  // cell key "x+:u,v"  (face = axis letter + sign; u,v = the other two axes in x,y,z order)
  // cells: key -> { t: '/' | '\\' (rotatable mirror), 'a' | 'b' (locked), '#' brick, 'L' lantern, 'T' target }
  var SN = 4, BEAM_H = .13;
  var AX = { x: 0, y: 1, z: 2 };
  function faceInfo(f) { const a = AX[f[0]], s = f[1] === '+' ? 1 : -1, o = [0,1,2].filter(b => b !== a); return { a, s, u: o[0], v: o[1] }; }
  function cellP(key) { const [f, uv] = key.split(':'), [u, v] = uv.split(',').map(Number), F = faceInfo(f), p = [0,0,0]; p[F.a] = F.s < 0 ? -1 : SN; p[F.u] = u; p[F.v] = v; return { f, F, p }; }
  function keyFromP(f, p) { const F = faceInfo(f); return f + ':' + p[F.u] + ',' + p[F.v]; }
  function normalOf(f) { const F = faceInfo(f), n = [0,0,0]; n[F.a] = F.s; return n; }
  // world position of a cell centre lifted h above the surface
  function worldOf(f, p, h) {
    const F = faceInfo(f), w = [0,0,0];
    for (let i = 0; i < 3; i++) w[i] = i === F.a ? F.s * SN / 2 + F.s * h : p[i] - (SN - 1) / 2;
    return w;
  }
  function reflect(f, t, d) {
    const F = faceInfo(f), du = d[F.u], dv = d[F.v], n = [0,0,0];
    if (t === '/' || t === 'a') { n[F.u] = dv; n[F.v] = du; } else { n[F.u] = -dv; n[F.v] = -du; }
    return n;
  }
  // one step from (f,p) along d, wrapping over an edge when needed
  function stepS(f, p, d) {
    const q = [p[0] + d[0], p[1] + d[1], p[2] + d[2]], ad = d[0] ? 0 : d[1] ? 1 : 2;
    if (q[ad] >= 0 && q[ad] < SN) return { f, p: q, d, wrapped: false };
    const F = faceInfo(f), nf = 'xyz'[ad] + (d[ad] > 0 ? '+' : '-');
    q[F.a] = F.s < 0 ? 0 : SN - 1;
    const nd = [0,0,0]; nd[F.a] = -F.s;
    return { f: nf, p: q, d: nd, wrapped: true };
  }
  // lanterns: [{ k: key, d: [dx,dy,dz], c }]
  function traceS(cells, lanterns) {
    const paths = [], ends = {}, endD = {}, hits = [], sparks = [];
    lanterns.forEach(l => {
      let { f, p } = cellP(l.k), d = l.d.slice(), dist = 0;
      const pts = [worldOf(f, p, BEAM_H)], seen = new Set();
      const add = (pt) => { const q = pts[pts.length - 1]; dist += Math.hypot(pt[0] - q[0], pt[1] - q[1], pt[2] - q[2]); pts.push(pt); };
      for (let k = 0; k < 400; k++) {
        const c0 = worldOf(f, p, BEAM_H);
        const s = stepS(f, p, d);
        if (s.wrapped) add([c0[0] + d[0] * (.5 + BEAM_H), c0[1] + d[1] * (.5 + BEAM_H), c0[2] + d[2] * (.5 + BEAM_H)]);
        ({ f, p, d } = s);
        const key = keyFromP(f, p), cell = cells[key], c = worldOf(f, p, BEAM_H);
        const sk = key + '|' + d.join(',');
        if (seen.has(sk)) { add(c); break; } seen.add(sk);
        if (!cell) continue;
        if (cell.t === 'T') { add(c); ends[key] = (ends[key] || 0) | l.c; endD[key] = Math.max(endD[key] || 0, dist); break; }
        if (cell.t === '#' || cell.t === 'L') { add([c[0] - d[0] * .42, c[1] - d[1] * .42, c[2] - d[2] * .42]); if (cell.t === '#') { hits.push({ k: key, c: l.c, d: dist }); sparks.push({ p: pts[pts.length - 1], c: l.c, d: dist }); } break; }
        add(c); hits.push({ k: key, c: l.c, d: dist });
        d = reflect(f, cell.t, d);
      }
      paths.push({ pts, c: l.c });
    });
    return { paths, ends, endD, hits, sparks };
  }
  function isWinS(cells, L) { const e = traceS(cells, L.lanterns).ends; return L.targets.every(t => e[t.k] === t.c); }
  const N = SN;
  const COLORS = {
    1: { name: 'kırmızı', hex: '#ff5d73' }, 2: { name: 'yeşil', hex: '#4ee89a' }, 3: { name: 'sarı', hex: '#ffc93d' },
    4: { name: 'mavi', hex: '#4c9dff' }, 5: { name: 'mor', hex: '#d27bff' }, 6: { name: 'turkuaz', hex: '#3ef0d8' }, 7: { name: 'beyaz', hex: '#ffffff' },
  };
  const hex = c => COLORS[c].hex;
  const LEVELS = [{"lanterns": [{"k": "z-:0,2", "d": [0, -1, 0], "c": 4}], "targets": [{"k": "z+:0,0", "c": 4}], "cells": [["z-:0,1", "/"], ["z+:0,1", "/"]]}, {"lanterns": [{"k": "z-:1,0", "d": [-1, 0, 0], "c": 3}], "targets": [{"k": "z+:2,0", "c": 3}], "cells": [["x-:0,2", "/"], ["y-:1,2", "/"], ["z+:1,0", "\\"]]}, {"lanterns": [{"k": "x+:1,3", "d": [0, 0, 1], "c": 2}], "targets": [{"k": "x-:0,0", "c": 2}], "cells": [["z+:1,1", "\\"], ["z+:1,2", "b"], ["z+:0,2", "\\"], ["z+:0,0", "\\"], ["z-:0,3", "#"], ["x-:2,1", "#"], ["z+:2,0", "#"]]}, {"lanterns": [{"k": "x-:2,0", "d": [0, 0, 1], "c": 1}, {"k": "x+:2,3", "d": [0, 0, 1], "c": 4}], "targets": [{"k": "z-:1,1", "c": 1}, {"k": "y-:1,3", "c": 4}], "cells": [["x-:2,3", "/"], ["x-:1,3", "\\"], ["z+:1,2", "/"], ["z+:1,1", "\\"], ["x-:3,2", "#"], ["z-:3,0", "#"]]}, {"lanterns": [{"k": "y-:2,1", "d": [-1, 0, 0], "c": 5}], "targets": [{"k": "x-:1,1", "c": 5}], "cells": [["y-:1,1", "\\"], ["z-:1,0", "/"], ["x-:0,0", "\\"], ["x-:2,0", "b"], ["z-:0,2", "/"], ["y+:0,1", "\\"], ["x+:0,3", "#"], ["z+:0,2", "#"], ["z-:1,3", "#"], ["z+:2,0", "#"]]}, {"lanterns": [{"k": "y-:3,2", "d": [1, 0, 0], "c": 6}, {"k": "z-:3,0", "d": [0, -1, 0], "c": 3}], "targets": [{"k": "x-:1,2", "c": 6}, {"k": "y+:3,1", "c": 3}], "cells": [["x+:0,2", "\\"], ["x+:0,3", "\\"], ["y-:2,3", "a"], ["y-:2,2", "\\"], ["y-:3,1", "\\"], ["x+:0,1", "\\"], ["y+:3,2", "/"], ["z-:2,3", "#"], ["z-:0,3", "#"], ["y+:0,1", "#"], ["z-:1,1", "#"]]}, {"lanterns": [{"k": "y-:2,0", "d": [1, 0, 0], "c": 1}, {"k": "x+:2,2", "d": [0, 0, 1], "c": 2}, {"k": "z+:2,0", "d": [1, 0, 0], "c": 4}], "targets": [{"k": "y+:1,0", "c": 1}, {"k": "x-:2,3", "c": 2}, {"k": "y-:2,2", "c": 4}], "cells": [["x+:3,0", "b"], ["z-:0,3", "b"], ["y+:0,0", "/"], ["z+:1,2", "/"], ["z+:1,3", "/"], ["x-:3,3", "\\"], ["x+:0,3", "/"], ["y-:0,3", "\\"], ["y-:0,2", "/"], ["x-:3,2", "#"], ["z-:3,1", "#"], ["z+:0,2", "#"], ["y+:0,2", "#"], ["y+:1,1", "#"]]}, {"lanterns": [{"k": "y+:0,0", "d": [0, 0, 1], "c": 5}, {"k": "y-:0,3", "d": [1, 0, 0], "c": 6}, {"k": "z-:2,3", "d": [1, 0, 0], "c": 3}], "targets": [{"k": "y-:3,1", "c": 5}, {"k": "z-:2,0", "c": 6}, {"k": "z+:1,1", "c": 3}], "cells": [["z+:0,2", "\\"], ["x-:2,3", "a"], ["x-:1,3", "/"], ["x-:1,1", "a"], ["y-:1,3", "/"], ["y-:1,2", "/"], ["y-:3,2", "/"], ["z+:3,0", "\\"], ["x+:3,0", "/"], ["x+:1,0", "\\"], ["x+:3,1", "#"], ["x+:2,2", "#"], ["z-:3,1", "#"], ["x-:0,2", "#"], ["x+:3,2", "#"], ["x-:3,2", "#"]]}];
  const HINTS = {
    0: 'Aynalara dokunup çevir, sonra düğmeye bas. Işık kenara gelince <b>yandaki yüze geçer</b>: küpü çevirip takip et.',
    1: 'Işık küpün etrafında birkaç yüz dolaşabilir.',
    2: 'Kilitli (mor) aynalar dönmez, tuğlalar ışığı keser.',
    3: 'İki fener! Her ışık kendi rengindeki hedefe gitmeli.',
  };
  const $ = id => document.getElementById(id);
  const stage = $('stage');

  /* ---------- state ---------- */
  let lvl = 0, L, cells, moves = 0, lightOn = false, solved = false, optimal = 0, layer = -1;
  let progress = {}, soundOn = true;
  try { progress = JSON.parse(localStorage.getItem('fenerkup-progress') || '{}'); soundOn = localStorage.getItem('fener-sound') !== '0'; } catch (e) {}
  const save = () => { try { localStorage.setItem('fenerkup-progress', JSON.stringify(progress)); localStorage.setItem('fener-sound', soundOn ? '1' : '0'); } catch (e) {} };
  const unlocked = i => i === 0 || !!progress[i - 1] || !!progress[i];

  /* ---------- sound ---------- */
  let ac = null;
  function tone(freq, dur = .12, type = 'sine', vol = .08, delay = 0) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  const sfx = {
    rotate: () => tone(560, .08, 'triangle', .06), locked: () => tone(150, .12, 'square', .035),
    on: () => { tone(330, .15, 'sine', .07); tone(660, .25, 'sine', .05, .05); }, off: () => tone(240, .12, 'sine', .05),
    hit: i => tone(660 + i * 110, .35, 'sine', .06), win: () => [523, 659, 784, 1046].forEach((f, k) => tone(f, .4, 'triangle', .07, k * .11)),
  };
  const soundIcon = () => $('soundBtn').innerHTML = soundOn
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'

      if (u.shake) { const k = (now - u.shake) / 300; m.rotateY(k < 1 ? Math.sin(k * 20) * .03 : 0); if (k >= 1) { u.shake = 0; m.quaternion.copy(u.targetQ); } }
    });
    lanternSprites.forEach((sp, i) => { const b = lightOn && !reduce ? Math.sin(now / 300 + i) * .03 : 0; sp.scale.set(.8 + b, .8 + b, 1); });
    animateCamera(now); updateBeams(now);
    renderer.render(scene, camera);
    requestAnimationFrame(frameLoop);
  }
  resize();
  let start = 0; while (progress[start] && start < LEVELS.length - 1) start++;
  load(start);
  requestAnimationFrame(frameLoop);
})();
</script>
