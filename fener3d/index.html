<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fener Küpü</title>
<meta name="description" content="Fener ve Aynalar'ın küp hali: altı yüzlü küpte aynalar, çıkıntılar ve içi aynalı borularla ışığı hedefe ulaştır.">
<meta name="theme-color" content="#0b1230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  /* Layout: same cute night look as the 2D game; a full-height 3D stage under a compact top bar */
  :root {
    color-scheme: dark;
    --sky-0: #0b1230;
    --sky-1: #1a2458;
    --ink: #f4f6ff;
    --muted: #a9b3e0;
    --sun: #ffd166;
    --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, #0b1230, #1d2a66) fixed, var(--sky-0);
    color: var(--ink); font-family: var(--body);
    user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column; overflow: hidden;
    padding-block: 10px 0;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .top { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); width: 100%; max-width: 640px; margin: 0 auto; flex: none; }
  header { display: flex; align-items: center; gap: 8px; }
  h1 { flex: 1; margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(20px, 6vw, 26px); line-height: 1; color: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h1 small { font-size: .55em; color: var(--muted); font-weight: 700; margin-left: 4px; }
  .iconbtn { width: 40px; height: 40px; border-radius: 14px; border: none; cursor: pointer; flex: none; background: rgba(255,255,255,.09); color: var(--ink); display: grid; place-items: center; }
  .iconbtn svg { width: 20px; height: 20px; }
  .iconbtn:active { transform: scale(.92); }
  .bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .step { width: 34px; height: 34px; border-radius: 12px; border: none; background: rgba(255,255,255,.09); color: var(--ink); font-size: 20px; font-weight: 800; cursor: pointer; display: grid; place-items: center; padding: 0; line-height: 1; }
  .step:disabled { opacity: .3; cursor: default; }
  #levelTitle { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1; white-space: nowrap; }
  #levelLights { display: flex; gap: 4px; flex: 1; }
  #levelLights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: currentColor; }
  #moves { font-family: var(--display); font-weight: 700; font-size: 15px; line-height: 1; padding: 9px 12px 7px; border-radius: 999px; background: rgba(255,255,255,.09); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #hint { font-size: 14px; font-weight: 700; color: var(--muted); margin: 10px 0 0; text-align: center; min-height: 19px; text-wrap: balance; }
  #hint b { color: var(--ink); }

  #stage { position: relative; flex: 1; min-height: 280px; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }

  .dock {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px;
    padding: 0 max(14px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  #power {
    width: 66px; height: 66px; border-radius: 50%; border: none; cursor: pointer; padding: 0; flex: none;
    background: #ff5d73; color: #fff; display: grid; place-items: center;
    box-shadow: 0 5px 0 #c23452; transition: transform .08s, box-shadow .08s, background .25s;
  }
  #power svg { width: 50%; height: 50%; }
  #power:active { transform: translateY(4px); box-shadow: 0 1px 0 #c23452; }
  #power.on { background: #39d98a; box-shadow: 0 5px 0 #1f9e5f; }
  #power.nudge { animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.1); } }
  .findbtn { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); height: 40px; padding: 0 14px; border-radius: 14px; border: none; background: rgba(255,255,255,.1); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 15px; cursor: pointer; z-index: 2; }
  #dragHint { position: absolute; left: 50%; top: 10px; translate: -50% 0; font-size: 13px; font-weight: 800; color: var(--muted); background: rgba(10,15,40,.6); padding: 6px 12px; border-radius: 99px; pointer-events: none; transition: opacity .5s; white-space: nowrap; }

  .overlay { position: fixed; inset: 0; display: none; place-items: center; z-index: 10; background: rgba(6, 9, 26, .6); padding: 16px; }
  .overlay.show { display: grid; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } }
  .card { max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--sky-1); border-radius: 26px; padding: 24px 22px 22px; text-align: center; width: min(340px, 100%); animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.8); } }
  .card h2 { font-family: var(--display); margin: 0 0 4px; font-size: 28px; line-height: 1.1; color: var(--sun); }
  .card p { margin: 0 0 14px; color: var(--muted); font-size: 15px; font-weight: 700; }
  .stars { font-size: 42px; letter-spacing: 8px; margin-bottom: 16px; line-height: 1; }
  .stars span { display: inline-block; animation: starIn .45s cubic-bezier(.3,1.8,.5,1) backwards; }
  .stars span:nth-child(2) { animation-delay: .15s; } .stars span:nth-child(3) { animation-delay: .3s; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); } }
  .stars .off { color: #3a4580; } .stars .on { color: var(--sun); }
  .btn { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1; border: none; border-radius: 16px; padding: 13px 22px 11px; cursor: pointer; background: var(--sun); color: #3a2500; box-shadow: 0 4px 0 #d49a1e; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d49a1e; }
  #levelGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 16px; }
  #levelGrid button { aspect-ratio: 1; border-radius: 14px; border: none; cursor: pointer; padding: 0; background: rgba(255,255,255,.09); color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1; }
  #levelGrid button small { font-size: 10px; color: var(--sun); letter-spacing: -1px; min-height: 10px; }
  #levelGrid button.cur { background: var(--sun); color: #3a2500; }
  #levelGrid button.cur small { color: #3a2500; }
  #levelGrid button:disabled { opacity: .3; cursor: default; }
  .ghost { background: none; border: none; color: var(--muted); font-weight: 800; font-size: 15px; cursor: pointer; padding: 6px 10px; }
  #err { display: none; position: absolute; inset: 0; place-items: center; text-align: center; padding: 20px; color: var(--muted); font-weight: 700; }
  /* tutorial cards */
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
  .tutart { background: #141c45; border-radius: 18px; padding: 8px; margin: 12px 0 12px; }
  .tutart svg { width: 100%; height: auto; display: block; }
  #tutText { text-wrap: pretty; }
  .t-s1, .t-s2, .t-s3 { stroke-dasharray: 1 1; }
  .t-s1 { animation: tS1 5s infinite; } .t-s2 { animation: tS2 5s infinite; } .t-s3 { animation: tS3 5s infinite; }
  @keyframes tS1 { 0%, 15% { stroke-dashoffset: 1; opacity: 1; } 40%, 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes tS2 { 0%, 40% { stroke-dashoffset: 1; opacity: 1; } 65%, 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes tS3 { 0%, 65% { stroke-dashoffset: 1; opacity: 1; } 82%, 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
  .t-show1 { animation: tShow1 5s infinite; } .t-show2 { animation: tShow2 5s infinite; } .t-show3 { animation: tShow3 5s infinite; }
  @keyframes tShow1 { 0%, 40% { opacity: 0; } 45%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
  @keyframes tShow2 { 0%, 65% { opacity: 0; } 70%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
  @keyframes tShow3 { 0%, 82% { opacity: 0; } 86%, 90% { opacity: 1; } 96%, 100% { opacity: 0; } }
  .t-rot { animation: tRot 5s infinite; }
  @keyframes tRot { 0%, 6% { transform: rotate(-45deg); } 14%, 100% { transform: rotate(45deg); } }
  .t-tap { transform-box: fill-box; transform-origin: center; animation: tTap 5s infinite; }
  @keyframes tTap { 0% { transform: scale(.4); opacity: 0; } 3% { opacity: 1; } 11% { transform: scale(1.4); opacity: 0; } 100% { opacity: 0; } }
  .t-shake { animation: tShake 5s infinite; }
  @keyframes tShake { 0%, 9% { transform: rotate(-45deg); } 12% { transform: rotate(-33deg); } 15% { transform: rotate(-57deg); } 18% { transform: rotate(-38deg); } 22%, 100% { transform: rotate(-45deg); } }
  .t-blink1 { animation: tBlink1 5s infinite; }
  @keyframes tBlink1 { 0%, 40% { opacity: 0; } 44% { opacity: 1; } 52% { opacity: .3; } 60% { opacity: 1; } 68% { opacity: .3; } 76%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
  .t-drag { animation: tDrag 5s infinite; }
  @keyframes tDrag { 0%, 8% { transform: translateX(0); opacity: 0; } 14% { opacity: 1; } 40% { transform: translateX(-34px); opacity: 1; } 48%, 100% { transform: translateX(-34px); opacity: 0; } }
  .t-glow1 { animation: tGlow1 5s infinite; }
  @keyframes tGlow1 { 0%, 40% { fill: #2a4fb8; } 44%, 88% { fill: #ffb347; } 96%, 100% { fill: #2a4fb8; } }
  .t-led { animation: tLed 5s infinite; }
  @keyframes tLed { 0%, 42% { fill: #6b5a4a; } 46%, 88% { fill: #5dff9d; } 96%, 100% { fill: #6b5a4a; } }
  .t-sink { transform-box: fill-box; transform-origin: center bottom; animation: tSink 5s infinite; }
  @keyframes tSink { 0%, 42% { transform: scaleY(1); opacity: 1; } 52%, 88% { transform: scaleY(.08); opacity: .5; } 96%, 100% { transform: scaleY(1); opacity: 1; } }
  .t-bloom { transform-box: fill-box; transform-origin: left center; animation: tBloom 5s infinite; }
  @keyframes tBloom { 0%, 40% { transform: scale(.35, .7); } 50%, 88% { transform: scale(1, 1); } 96%, 100% { transform: scale(.35, .7); } }
  .t-rot2 { animation: tRot2 5s infinite; }
  @keyframes tRot2 { 0%, 42% { transform: rotate(45deg); } 52%, 92% { transform: rotate(-45deg); } 100% { transform: rotate(45deg); } }
  @media (prefers-reduced-motion: reduce) { .tutart * { animation: none !important; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="top">
  <header>
    <h1>Fener Küpü <small>3B</small></h1>
    <button class="iconbtn" id="helpBtn" title="Nasıl oynanır" aria-label="Nasıl oynanır"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg></button>
    <button class="iconbtn" id="levelsBtn" title="Bölümler" aria-label="Bölümler"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></svg></button>
    <button class="iconbtn" id="soundBtn" title="Ses" aria-label="Sesi aç/kapat"></button>
    <button class="iconbtn" id="resetBtn" title="Bölümü sıfırla" aria-label="Bölümü sıfırla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  </header>
  <div class="bar">
    <button class="step" id="prevBtn" aria-label="Önceki bölüm">‹</button>
    <span id="levelTitle"></span>
    <button class="step" id="nextBtn" aria-label="Sonraki bölüm">›</button>
    <span id="levelLights"></span>
    <span id="moves">Hamle 0</span>
  </div>
  <p id="hint"></p>
</div>

<div id="stage">
  <div id="dragHint">Küpü sürükleyerek çevir</div>
  <button id="findBtn" class="findbtn">Feneri göster</button>
  <div id="err">3B görüntü bu cihazda açılamadı.</div>
  <div class="dock">
    <button id="power" aria-label="Fenerleri aç/kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.6a8 8 0 1 0 11.4 0"/></svg></button>
  </div>
</div>

<div class="overlay" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="card">
    <h2 id="winTitle">Işık hedefte!</h2>
    <p id="winText"></p>
    <div class="stars" id="starsOut"></div>
    <button class="btn" id="winNext">Sonraki bölüm</button>
  </div>
</div>
<div class="overlay" id="tutDlg" role="dialog" aria-modal="true" aria-labelledby="tutTitle">
  <div class="card">
    <div class="eyebrow">Nasıl çalışır?</div>
    <h2 id="tutTitle"></h2>
    <div class="tutart" id="tutArt"></div>
    <p id="tutText"></p>
    <button class="btn" id="tutOk">Anladım</button>
  </div>
</div>
<div class="overlay" id="levelsDlg" role="dialog" aria-modal="true" aria-labelledby="levelsTitle">
  <div class="card">
    <h2 id="levelsTitle">Bölümler</h2>
    <div id="levelGrid"></div>
    <button class="ghost" id="levelsClose">Kapat</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---- surface-cube light engine: six 4x4 faces, light wraps over the cube's edges ----
  // cell key "x+:u,v"  (face = axis letter + sign; u,v = the other two axes in x,y,z order)
  // cells: key -> { t: '/' | '\\' (rotatable mirror), 'a' | 'b' (locked), 'H' bump, 'L' lantern, 'T' target,
  //                 'P' pipe mouth { o: direction the mouth faces, to: other mouth key },
  //                 'Y' input mouth of a Y pipe { o, to: output key }, 'Q' Y pipe output { o } (two inputs, one output: the colours add up),
  //                 'O' hole mouth (open), 'U' hole mouth with a 45° tilt mirror { fi: which of the 4 surface directions it faces },
  //                 'S' sensor, 'D' door (closed blocks light), 'F' sun flower, 'c' / 'e' motor mirror ('/' / '\\', turned by a flower) }
  var SN = 4, BEAM_H = .2;
  var AX = { x: 0, y: 1, z: 2 };
  function faceInfo(f) { const a = AX[f[0]], s = f[1] === '+' ? 1 : -1, o = [0,1,2].filter(b => b !== a); return { a, s, u: o[0], v: o[1] }; }
  function cellP(key) { const [f, uv] = key.split(':'), [u, v] = uv.split(',').map(Number), F = faceInfo(f), p = [0,0,0]; p[F.a] = F.s < 0 ? -1 : SN; p[F.u] = u; p[F.v] = v; return { f, F, p }; }
  function keyFromP(f, p) { const F = faceInfo(f); return f + ':' + p[F.u] + ',' + p[F.v]; }
  function normalOf(f) { const F = faceInfo(f), n = [0,0,0]; n[F.a] = F.s; return n; }
  // world position of a cell centre lifted h above the surface
  function worldOf(f, p, h) {
    const F = faceInfo(f), w = [0,0,0];
    for (let i = 0; i < 3; i++) w[i] = i === F.a ? F.s * SN / 2 + F.s * h : p[i] - (SN - 1) / 2;
    return w;
  }
  function tangentDirsS(f) { const F = faceInfo(f), out = []; [F.u, F.v].forEach(ax => [1, -1].forEach(s => { const d = [0,0,0]; d[ax] = s; out.push(d); })); return out; }
  // the cell straight across the cube (the other end of a hole)
  function oppositeCell(key) { const { f, F, p } = cellP(key), q = p.slice(); q[F.a] = F.s < 0 ? SN : -1; const g = f[0] + (f[1] === '+' ? '-' : '+'); return { f: g, p: q, key: keyFromP(g, q) }; }
  var add3 = (a, b, k) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
  // points along a mirrored pipe from mouth A (light enters) to mouth B (light leaves)
  function pipeCurve(ka, oa, kb, ob) {
    const A = cellP(ka), B = cellP(kb), na = normalOf(A.f), nb = normalOf(B.f);
    const ca = worldOf(A.f, A.p, BEAM_H), cb = worldOf(B.f, B.p, BEAM_H);
    const ea = add3(ca, oa, .5), eb = add3(cb, ob, .5);
    const ua = add3(ca, na, .5), ub = add3(cb, nb, .5);
    const span = Math.hypot(ca[0] - cb[0], ca[1] - cb[1], ca[2] - cb[2]), H = .55 + span * .35;
    const pts = [];
    const quad = (p0, p1, p2, n) => { for (let i = 1; i <= n; i++) { const t = i / n, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t; pts.push([0,1,2].map(j => a * p0[j] + b * p1[j] + c * p2[j])); } };
    const cub = (p0, p1, p2, p3, n) => { for (let i = 1; i <= n; i++) { const t = i / n, a = (1 - t) ** 3, b = 3 * (1 - t) ** 2 * t, c = 3 * (1 - t) * t * t, d = t ** 3; pts.push([0,1,2].map(j => a * p0[j] + b * p1[j] + c * p2[j] + d * p3[j])); } };
    pts.push(ea);
    quad(ea, ca, ua, 6);
    cub(ua, add3(ua, na, H), add3(ub, nb, H), ub, 18);
    quad(ub, cb, eb, 6);
    return pts;
  }
  function reflect(f, t, d) {
    const F = faceInfo(f), du = d[F.u], dv = d[F.v], n = [0,0,0];
    if (t === '/' || t === 'a' || t === 'c') { n[F.u] = dv; n[F.v] = du; } else { n[F.u] = -dv; n[F.v] = -du; }
    return n;
  }
  // one step from (f,p) along d, wrapping over an edge when needed
  function stepS(f, p, d) {
    const q = [p[0] + d[0], p[1] + d[1], p[2] + d[2]], ad = d[0] ? 0 : d[1] ? 1 : 2;
    if (q[ad] >= 0 && q[ad] < SN) return { f, p: q, d, wrapped: false };
    const F = faceInfo(f), nf = 'xyz'[ad] + (d[ad] > 0 ? '+' : '-');
    q[F.a] = F.s < 0 ? 0 : SN - 1;
    const nd = [0,0,0]; nd[F.a] = -F.s;
    return { f: nf, p: q, d: nd, wrapped: true };
  }
  // lanterns: [{ k: key, d: [dx,dy,dz], c }]
  function traceS(cells, lanterns) {
    const paths = [], ends = {}, endD = {}, hits = [], sparks = [];
    lanterns.forEach(l => {
      let { f, p } = cellP(l.k), d = l.d.slice(), dist = 0;
      const pts = [worldOf(f, p, BEAM_H)], seen = new Set();
      const add = (pt) => { const q = pts[pts.length - 1]; dist += Math.hypot(pt[0] - q[0], pt[1] - q[1], pt[2] - q[2]); pts.push(pt); };
      for (let k = 0; k < 400; k++) {
        const c0 = worldOf(f, p, BEAM_H);
        const s = stepS(f, p, d);
        if (s.wrapped) add([c0[0] + d[0] * (.5 + BEAM_H), c0[1] + d[1] * (.5 + BEAM_H), c0[2] + d[2] * (.5 + BEAM_H)]);
        ({ f, p, d } = s);
        const key = keyFromP(f, p), cell = cells[key], c = worldOf(f, p, BEAM_H);
        const sk = key + '|' + d.join(',');
        if (seen.has(sk)) { add(c); break; } seen.add(sk);
        if (!cell || cell.t === 'O') continue;
        if (cell.t === 'U') {
          const fd = tangentDirsS(f)[cell.fi];
          if (d[0] === -fd[0] && d[1] === -fd[1] && d[2] === -fd[2]) {
            // the tilt mirror sends the light down the hole, straight through the cube
            add(c); hits.push({ k: key, c: l.c, d: dist });
            const ex = oppositeCell(key), ce = worldOf(ex.f, ex.p, BEAM_H), exCell = cells[ex.key];

    const lantern = (x, y, col, dir = 0) => `<g transform="translate(${x} ${y})"><g transform="rotate(${dir})"><path d="M9 -7 L19 -11 Q21 0 19 11 L9 7 Z" fill="${col}"/></g><rect x="-13" y="-13" width="26" height="26" rx="9" fill="${col}"/><circle cx="-4" cy="-2" r="2" fill="#1b1f3b"/><circle cx="4" cy="-2" r="2" fill="#1b1f3b"/><path d="M-3 4 q3 3 6 0" stroke="#1b1f3b" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`;
    const target = (x, y, col, cls) => `<g transform="translate(${x} ${y})"><circle r="15" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="5 4"/><circle r="10.5" fill="#2b3778"/><path d="M-6 -1 h4 M2 -1 h4" stroke="#a9b3e0" stroke-width="1.8" stroke-linecap="round"/><g class="${cls}" style="opacity:0"><circle r="10.5" fill="${col}"/><path d="M-6 0 q2.5 -3.5 5 0 M1 0 q2.5 -3.5 5 0" stroke="#1b1f3b" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M-3.5 3.5 q3.5 4 7 0" fill="#1b1f3b"/></g></g>`;
    const beam = (d, col, cls) => `<path class="${cls}" pathLength="1" d="${d}" stroke="${col}" stroke-width="10" opacity=".35" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="${cls}" pathLength="1" d="${d}" stroke="${col}" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="${cls}" pathLength="1" d="${d}" stroke="#fff" stroke-width="1.6" opacity=".85" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    const tap = (x, y, cls = 't-tap') => `<g transform="translate(${x} ${y})"><circle class="${cls}" r="14" fill="none" stroke="#fff" stroke-width="2.5"/></g>`;
    const spark = (x, y, col, cls) => `<circle class="${cls}" cx="${x}" cy="${y}" r="6" fill="${col}" style="opacity:0"/><circle class="${cls}" cx="${x}" cy="${y}" r="11" fill="${col}" style="opacity:0" opacity=".35"/>`;
    const svg = inner => `<svg viewBox="0 0 260 150" role="img" aria-hidden="true">${inner}</svg>`;
    // isometric helper for the cube cards
    const iso = (x, y, z, s = 15) => [130 + (x - z) * .866 * s, 92 + (x + z) * .5 * s - y * s];
    const P = pts => pts.map((p, i) => (i ? 'L' : 'M') + iso(...p).map(v => v.toFixed(1)).join(' ')).join(' ');
    const cubeSVG = () => {
      const face = (pts, fill) => `<path d="${P(pts)} Z" fill="${fill}" stroke="#0b1230" stroke-width="1.5"/>`;
      let g = face([[0,4,0],[4,4,0],[4,4,4],[0,4,4]], '#34418b') + face([[4,4,0],[4,0,0],[4,0,4],[4,4,4]], '#26306b') + face([[0,4,4],[4,4,4],[4,0,4],[0,0,4]], '#2b3778');
      for (let i = 1; i < 4; i++) g += `<path d="${P([[i,4,0],[i,4,4]])} ${P([[0,4,i],[4,4,i]])} ${P([[4,i,0],[4,i,4]])} ${P([[4,4,i],[4,0,i]])} ${P([[i,4,4],[i,0,4]])} ${P([[0,i,4],[4,i,4]])}" stroke="#0b1230" stroke-width="1" fill="none" opacity=".7"/>`;
      return g;
    };
    const ground = `<path d="M10 112 H250" stroke="#2b3778" stroke-width="10" stroke-linecap="round"/>`;
    const hump = x => `<rect x="${x - 22}" y="66" width="44" height="42" rx="8" fill="#6fd3a0"/><rect x="${x - 14}" y="72" width="28" height="8" rx="4" fill="#9ae9bf"/>`;
    const [lx, ly] = iso(.5, 4, 2), [ex, ey] = iso(4.3, 4.3, 2), [tx, ty] = iso(4, 1.2, 2);

    const CARDS = {
      basics: { title: 'Aynalar', text: 'Aynaya dokununca 90° döner. Köşedeki düğmeye basınca ışık aynadan yansır ve hedefe gider.',
        svg: svg(tiles([80, 120, 160], 60) + tile(120, 110) + lantern(36, 60, BL) + mirror(120, 60, -45, 't-rot') + tap(120, 60) + beam('M50 60 H120', BL, 't-s1') + beam('M120 60 V100', BL, 't-s2') + target(120, 112, BL, 't-show2')) },
      brick: { title: 'Tuğla', text: 'Tuğla ışığı keser. Işığı tuğlanın çevresinden dolaştırmak gerekir.',
        svg: svg(tiles([80, 120], 75) + `<g transform="translate(160 75)"><rect x="-17" y="-17" width="34" height="34" rx="8" fill="#8a5f45"/><rect x="-13" y="-12" width="12" height="7" rx="2" fill="#a8775a"/><rect x="2" y="-12" width="12" height="7" rx="2" fill="#a8775a"/><rect x="-6" y="-3" width="12" height="7" rx="2" fill="#a8775a"/><rect x="-13" y="6" width="12" height="7" rx="2" fill="#a8775a"/><rect x="2" y="6" width="12" height="7" rx="2" fill="#a8775a"/></g>` + target(220, 75, YE, 'never') + lantern(36, 75, YE) + beam('M50 75 H142', YE, 't-s1') + spark(142, 75, YE, 't-blink1')) },
      locked: { title: 'Kilitli ayna', text: 'Kilitli aynalar yerlerinde sabittir, dokununca dönmezler. Diğer aynaları onlara göre ayarla.',
        svg: svg(tiles([80], 75) + tile(130, 75, '#3d3b6e') + lockI(142, 63) + `<g transform="translate(130 75)"><g class="t-shake">${bar('#d9d6f2')}</g></g>` + tap(130, 75)) },
      two: { title: 'Birden fazla fener', text: 'Her ışık kendi rengindeki hedefe gitmeli. Bütün hedefler aynı anda yanınca bölüm biter.',
        svg: svg(tiles([80, 120, 160], 45) + tiles([80, 120, 160], 105) + lantern(36, 45, BL) + lantern(36, 105, RD) + beam('M50 45 H212', BL, 't-s1') + beam('M50 105 H212', RD, 't-s1') + target(224, 45, BL, 't-show1') + target(224, 105, RD, 't-show1')) },
      cross: { title: 'Kesişen ışınlar', text: 'Işınlar birbirinin içinden geçer, birbirini etkilemez.',
        svg: svg(tiles([90, 130, 170], 75) + tiles([130], 35) + tiles([130], 115) + lantern(46, 75, YE) + lantern(130, 16, '#4ee89a', 90) + beam('M60 75 H210', YE, 't-s1') + beam('M130 30 V128', '#4ee89a', 't-s1') + target(222, 75, YE, 't-show1') + target(130, 140, '#4ee89a', 't-show1')) },
      split: { title: 'Yeni: Yarı saydam ayna', text: 'Kesik çizgili ayna ışığın yarısını geçirir, yarısını yansıtır. Tek fenerle iki hedef yakılabilir. Dokununca o da döner.',
        svg: svg(tiles([80, 120, 160], 55) + tile(120, 105) + lantern(36, 55, YE) + half(120, 55, 45) + beam('M50 55 H120', YE, 't-s1') + beam('M120 55 H212', YE, 't-s2') + beam('M120 55 V95', YE, 't-s2') + target(224, 55, YE, 't-show2') + target(120, 112, YE, 't-show2')) },
      glass: { title: 'Yeni: Renkli cam', text: 'Cam yalnızca kendi rengini geçirir. Beyaz ışık kırmızı camdan kırmızı çıkar. Mavi ışık kırmızı camdan hiç geçemez.',
        svg: svg(tiles([80, 160], 45) + tiles([80, 160], 105) + [45, 105].map(y => `<g transform="translate(120 ${y})"><rect x="-17" y="-17" width="34" height="34" rx="8" fill="${RD}" opacity=".6" stroke="#ff9aa8" stroke-width="2.5"/><path d="M-9 8 L5 -10 M-2 12 L10 -4" stroke="#fff" stroke-width="2.5" opacity=".6" stroke-linecap="round"/></g>`).join('') + lantern(36, 45, '#ffffff') + lantern(36, 105, BL) + beam('M50 45 H103', '#ffffff', 't-s1') + beam('M103 45 H212', RD, 't-s2') + beam('M50 105 H110', BL, 't-s1') + spark(110, 105, BL, 't-blink1') + target(224, 45, RD, 't-show2')) },
      mix: { title: 'Yeni: Renk karışımı', text: 'İki ışık yarı saydam aynada birleşebilir. Işıklar toplanarak karışır: kırmızı + mavi = mor, kırmızı + yeşil = sarı.',
        svg: svg(tiles([80, 120, 160], 85) + tile(120, 45) + lantern(36, 85, RD) + lantern(120, 14, BL, 90) + half(120, 85, 45) + beam('M50 85 H120', RD, 't-s1') + beam('M120 28 V85', BL, 't-s1') + beam('M120 85 H212', PU, 't-s2') + target(224, 85, PU, 't-show2')) },
      wrap: { title: 'Küp', text: 'Küpün kenarlarında 45° eğik ayna şeritler var. Işık kenara gelince bu aynadan yansıyıp yandaki yüze geçer. Küpü parmağınla sürükleyerek çevir.',
        svg: svg(cubeSVG() + `<path d="${P([[4.3, 4.3, .1], [4.3, 4.3, 3.9]])}" stroke="#ffc6dd" stroke-width="7" stroke-linecap="round"/><path d="${P([[4.3, 4.3, .1], [4.3, 4.3, 3.9]])}" stroke="#eaf7ff" stroke-width="4" stroke-linecap="round"/>` + `<circle cx="${lx}" cy="${ly - 4}" r="9" fill="${BL}"/>` + beam(`M${lx} ${ly} L${ex} ${ey}`, BL, 't-s1') + beam(`M${ex} ${ey} L${tx} ${ty}`, BL, 't-s2') + target(tx, ty, BL, 't-show2') + `<g class="t-drag"><circle cx="215" cy="120" r="9" fill="#fff" opacity=".85"/><path d="M200 120 h-14 m5 -5 l-5 5 l5 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>`) },
      bump: { title: 'Yeni: Blok', text: 'Işık hep düz gider, bloğun üzerinden kendiliğinden geçemez. Bloğa çarpan ışık orada durur.',
        svg: svg(ground + hump(160) + lantern(36, 98, YE) + beam('M50 98 H137', YE, 't-s1') + spark(137, 98, YE, 't-blink1')) },
      pipe: { title: 'Yeni: İçi aynalı boru', text: 'Boru ışığı bir ağzından alır, iç duvarlarından yansıta yansıta öbür ağzından çıkarır. Işık ağzın baktığı yönden gelmeli.',
        svg: svg(ground + hump(130) + `<path d="M64 98 Q84 98 84 78 C84 14 176 14 176 78 Q176 98 196 98" stroke="#bfe3ff" stroke-width="20" opacity=".35" fill="none"/><path d="M64 98 Q84 98 84 78 C84 14 176 14 176 78 Q176 98 196 98" stroke="#e9f7ff" stroke-width="20" opacity=".5" fill="none" stroke-dasharray="2 14"/><circle cx="64" cy="98" r="9" fill="none" stroke="#ffc6dd" stroke-width="4"/><circle cx="196" cy="98" r="9" fill="none" stroke="#ffc6dd" stroke-width="4"/>` + lantern(26, 98, '#4ee89a') + beam('M40 98 H64', '#4ee89a', 't-s1') + beam('M64 98 Q84 98 84 78 C84 14 176 14 176 78 Q176 98 196 98', '#4ee89a', 't-s2') + beam('M196 98 H222', '#4ee89a', 't-s3') + target(236, 98, '#4ee89a', 't-show3')) },
    };
    const SEN = '#ff9a52';
    const sensorI = (x, y) => `<g transform="translate(${x} ${y})"><rect x="-14" y="-14" width="28" height="28" rx="5" fill="#ffc08a"/>${[0, 1, 2].map(i => [0, 1, 2].map(j => `<rect class="t-glow1" x="${-11 + i * 7.6}" y="${-11 + j * 7.6}" width="6.4" height="6.4" rx="1" fill="#2a4fb8"/>`).join('')).join('')}<circle class="t-led" cx="12" cy="12" r="3.5" fill="#6b5a4a"/></g>`;
    const doorI = (x, y, cls) => `<g transform="translate(${x} ${y})"><g class="${cls}"><rect x="-16" y="-16" width="32" height="32" rx="7" fill="${SEN}"/><rect x="-16" y="-3" width="32" height="6" fill="#ffc08a"/></g></g>`;
    const flowerI = (x, y) => `<g transform="translate(${x} ${y})">${[...Array(8)].map((_, i) => `<g style="transform: rotate(${i * 45}deg)"><ellipse class="t-bloom" cx="10" cy="0" rx="7" ry="4" fill="#ffd166"/></g>`).join('')}<circle r="6" fill="#8a5a2b"/></g>`;
    const motorBar = `<rect x="-22" y="-3.5" width="44" height="7" rx="3.5" fill="#ffe7a8" stroke="#ffb22e" stroke-width="2"/>`;
    CARDS.sensor = { title: 'Yeni: Güneş paneli ve kapı', text: 'Işık güneş paneline ulaşınca panel elektrik üretir, lambası yeşil yanar ve turuncu kapı yere iner. Artık başka bir ışık kapının olduğu yerden geçebilir.',
      svg: svg(tiles([80, 120], 40) + tiles([80, 160], 108) + tile(120, 108) + lantern(36, 40, YE) + beam('M50 40 H150', YE, 't-s1') + sensorI(162, 40) + lantern(36, 108, BL) + doorI(120, 108, 't-sink') + beam('M50 108 H103', BL, 't-s1') + beam('M103 108 H212', BL, 't-s2') + target(224, 108, BL, 't-show2')) };
    CARDS.flower = { title: 'Yeni: Güneş çiçeği', text: 'Işık güneş çiçeğine ulaşınca çiçek açar ve sarı çerçeveli motorlu aynayı 90° çevirir. Motorlu aynayı sen çeviremezsin.',
      svg: svg(tiles([80, 120], 40) + tiles([80, 120, 160], 108) + lantern(36, 40, YE) + beam('M50 40 H146', YE, 't-s1') + flowerI(160, 40) + tile(200, 108) + `<g transform="translate(200 108)"><g class="t-rot2" style="transform: rotate(45deg)">${motorBar}</g><circle cx="13" cy="-13" r="4" fill="#ffb22e"/></g>` + lantern(36, 108, '#4ee89a') + beam('M50 108 H200', '#4ee89a', 't-s2') + beam('M200 108 V60', '#4ee89a', 't-s3') + target(200, 52, '#4ee89a', 't-show3')) };
    CARDS.hole = { title: 'Yeni: Delik ve eğik ayna', text: 'Delik küpün içinden karşı yüze uzanır. Ağzındaki 45° eğik ayna ışığı aşağı, deliğin içine yollar; karşı uçtaki eğik ayna dışarı çıkarır. Periskop gibi. Eğik aynaya dokununca 4 yönden birine döner.',
      svg: svg(`<rect x="60" y="34" width="150" height="82" rx="8" fill="#26306b"/><rect x="60" y="30" width="150" height="6" rx="3" fill="#34418b"/><rect x="60" y="114" width="150" height="6" rx="3" fill="#34418b"/><rect x="121" y="30" width="18" height="90" fill="#05081a"/>`
        + `<g transform="translate(130 22) rotate(45)"><rect x="-15" y="-2.5" width="30" height="5" rx="2.5" fill="#e9f7ff" stroke="#5ee0d0" stroke-width="1.5"/></g>`
        + `<g transform="translate(130 128) rotate(45)"><rect x="-15" y="-2.5" width="30" height="5" rx="2.5" fill="#e9f7ff" stroke="#5ee0d0" stroke-width="1.5"/></g>`
        + lantern(30, 22, BL) + beam('M44 22 H130', BL, 't-s1') + beam('M130 22 V128', BL, 't-s2') + beam('M130 128 H210', BL, 't-s3') + target(222, 128, BL, 't-show3')) };
    CARDS.ypipe = { title: 'Yeni: Y boru', text: 'İki girişli borunun iki ağzına gelen ışıklar tek çıkışta birleşir. Işık renkleri toplanarak karışır: kırmızı + mavi = mor, kırmızı + yeşil = sarı, yeşil + mavi = turkuaz.',
      svg: svg(`<path d="M76 40 C130 40 120 75 160 75 M76 110 C130 110 120 75 160 75 H186" stroke="#e2d4ff" stroke-width="18" opacity=".35" fill="none" stroke-linecap="round"/><circle cx="76" cy="40" r="8" fill="none" stroke="#ffcf86" stroke-width="3.5"/><circle cx="76" cy="110" r="8" fill="none" stroke="#ffcf86" stroke-width="3.5"/><circle cx="186" cy="75" r="9" fill="none" stroke="#ffcf86" stroke-width="3.5"/>`
        + lantern(30, 40, RD) + lantern(30, 110, BL) + beam('M44 40 H76', RD, 't-s1') + beam('M44 110 H76', BL, 't-s1') + beam('M76 40 C130 40 120 75 160 75', RD, 't-s2') + beam('M76 110 C130 110 120 75 160 75', BL, 't-s2') + beam('M160 75 H212', PU, 't-s3') + target(226, 75, PU, 't-show3')) };
    return { CARDS };
  })();
  function tutSeen() { try { return JSON.parse(localStorage.getItem(TUT_KEY) || '{}'); } catch (e) { return {}; } }
  let tutQueue = [];
  function openCard(id) {
    const card = TUT.CARDS[id];
    $('tutTitle').textContent = card.title; $('tutText').textContent = card.text; $('tutArt').innerHTML = card.svg;
    $('tutOk').textContent = tutQueue.length ? 'Devam' : 'Anladım';
    $('tutDlg').classList.add('show'); $('tutOk').focus();
  }
  // ids: list of card ids; unseen ones are shown one after another (all of them when force)
  function showTutorials(ids, force) {
    const seen = tutSeen();
    tutQueue = ids.filter(id => TUT.CARDS[id] && (force || !seen[id]));
    tutQueue.forEach(id => seen[id] = 1);
    try { localStorage.setItem(TUT_KEY, JSON.stringify(seen)); } catch (e) {}
    if (tutQueue.length) openCard(tutQueue.shift());
  }
  function tutorialFor(i) { let k = i; while (k >= 0 && !(k in LEVEL_TUT)) k--; return k >= 0 ? LEVEL_TUT[k] : null; }
  $('tutOk').onclick = () => { if (tutQueue.length) openCard(tutQueue.shift()); else $('tutDlg').classList.remove('show'); };
  $('helpBtn').onclick = () => { const ids = tutorialFor(lvl); if (ids) showTutorials(ids, true); };
  $('soundBtn').onclick = () => { soundOn = !soundOn; save(); soundIcon(); };
  $('levelsBtn').onclick = () => {
    const wrap = $('levelGrid'); wrap.innerHTML = '';
    LEVELS.forEach((_, i) => {
      const b = document.createElement('button'); b.innerHTML = `${i + 1}<small>${'★'.repeat(progress[i] || 0)}</small>`;
      if (i === lvl) b.classList.add('cur'); b.disabled = !unlocked(i);
      b.onclick = () => { $('levelsDlg').classList.remove('show'); load(i); }; wrap.appendChild(b);
    });
    $('levelsDlg').classList.add('show');
  };
  $('levelsClose').onclick = () => $('levelsDlg').classList.remove('show');
  $('levelsDlg').onclick = e => { if (e.target === $('levelsDlg')) $('levelsDlg').classList.remove('show'); };
  soundIcon();

  /* ---------- background stars ---------- */
  const sc = $('stars'), sg = sc.getContext('2d');
  let starList = [];
  function starsResize() {
    const d = Math.min(2, devicePixelRatio || 1); sc.width = innerWidth * d; sc.height = innerHeight * d; sg.setTransform(d, 0, 0, d, 0, 0);
    starList = Array.from({ length: Math.round(innerWidth * innerHeight / 4500) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.2 + .4, p: Math.random() * 7, s: .5 + Math.random() * 1.5 }));
  }
  addEventListener('resize', starsResize); starsResize();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- loop ---------- */
  function frameLoop(now) {
    sg.clearRect(0, 0, innerWidth, innerHeight); sg.fillStyle = '#fff';
    for (const s of starList) { sg.globalAlpha = reduce ? .7 : .45 + .45 * Math.sin(now / 1000 * s.s + s.p); sg.beginPath(); sg.arc(s.x, s.y, s.r, 0, 7); sg.fill(); }
    sg.globalAlpha = 1;
    Object.values(mirrors).forEach(m => {
      const u = m.userData;
      if (u.t0) { const k = Math.min(1, (now - u.t0) / 260), e = 1 - Math.pow(1 - k, 3); m.quaternion.slerpQuaternions(u.fromQ, u.targetQ, e); if (k >= 1) u.t0 = 0; }
      if (u.shake) { const k = (now - u.shake) / 300; m.rotateY(k < 1 ? Math.sin(k * 20) * .05 : 0); if (k >= 1) { u.shake = 0; m.quaternion.copy(u.targetQ); } }
    });
    lanternSprites.forEach((sp, i) => { const b = lightOn && !reduce ? Math.sin(now / 300 + i) * .03 : 0; sp.scale.set(sp.userData.base + b, sp.userData.base + b, 1); });
    animateCamera(now); updateBeams(now);
    Object.values(doors).forEach(g => { const to = g.userData.to ?? 1; g.scale.y += (to - g.scale.y) * .15; });
    Object.values(flowerObjs).forEach(o => { o.open += (o.to - o.open) * .12; o.petals.forEach((pv, i) => { pv.children[0].rotation.z = (1 - o.open) * 1.25; pv.children[0].position.x = .1 + .07 * o.open; }); });
    renderer.render(scene, camera);
    requestAnimationFrame(frameLoop);
  }
  resize();
  let start = START_LEVEL; while (progress[start] && start < LEVELS.length - 1) start++;
  load(start);
  requestAnimationFrame(frameLoop);
})();
</script>
